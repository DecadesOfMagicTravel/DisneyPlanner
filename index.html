<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Disney Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=Pacifico&display=swap">
<style>
/* Layout concept: a sticky budget bar over six working tabs (trip & budget, dining, ride priorities, lightning lane, day plan, summary); drag cards onto slots, or tap to pick then tap to place. */
:root{
  --bg:#F1F4FA; --surface:#FFFFFF; --surface2:#E8EDF7; --line:#D3DBEA;
  --ink:#15213F; --muted:#56637F;
  --brand:#45D1CB; --on-brand:#0E1E26;
  --accent:#A85A06; --accent-soft:#FCE9D2;
  --good:#13774B; --good-soft:#D9F1E5;
  --bad:#B8322A; --bad-soft:#FADFDC;
  --drop:#6DECE0;
  --dom-lavender:#887BB0; --dom-mint:#6DECE0; --dom-butter:#FBE698;
  --dom-aqua:#45D1CB; --dom-rose:#F9BDC0; --dom-cream:#F6F5F1;
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1630; --surface:#172246; --surface2:#1F2D59; --line:#2D3C6C;
    --ink:#E9EEFB; --muted:#A3AFCF;
    --brand:#45D1CB; --on-brand:#0B1622;
    --accent:#F2A650; --accent-soft:#3B2C16;
    --good:#4CC38A; --good-soft:#163A2C;
    --bad:#FF8577; --bad-soft:#44201D;
    --drop:#1B4D5C;
    --dom-lavender:#887BB0; --dom-mint:#6DECE0; --dom-butter:#FBE698;
    --dom-aqua:#45D1CB; --dom-rose:#F9BDC0; --dom-cream:#F6F5F1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#172246; --surface2:#1F2D59; --line:#2D3C6C;
  --ink:#E9EEFB; --muted:#A3AFCF;
  --brand:#45D1CB; --on-brand:#0B1622;
  --accent:#F2A650; --accent-soft:#3B2C16;
  --good:#4CC38A; --good-soft:#163A2C;
  --bad:#FF8577; --bad-soft:#44201D;
  --drop:#1B4D5C;
  --dom-lavender:#887BB0; --dom-mint:#6DECE0; --dom-butter:#FBE698;
  --dom-aqua:#45D1CB; --dom-rose:#F9BDC0; --dom-cream:#F6F5F1;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1630; --surface:#172246; --surface2:#1F2D59; --line:#2D3C6C;
    --ink:#E9EEFB; --muted:#A3AFCF;
    --brand:#45D1CB; --on-brand:#0B1622;
    --accent:#F2A650; --accent-soft:#3B2C16;
    --good:#4CC38A; --good-soft:#163A2C;
    --bad:#FF8577; --bad-soft:#44201D;
    --drop:#1B4D5C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#172246; --surface2:#1F2D59; --line:#2D3C6C;
  --ink:#E9EEFB; --muted:#A3AFCF;
  --brand:#45D1CB; --on-brand:#0B1622;
  --accent:#F2A650; --accent-soft:#3B2C16;
  --good:#4CC38A; --good-soft:#163A2C;
  --bad:#FF8577; --bad-soft:#44201D;
  --drop:#1B4D5C; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
input[type=number]{width:92px;font-variant-numeric:tabular-nums}
input[type=time]{width:112px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted,.hint{color:var(--muted)}
.hint{font-size:.85rem}
.wrap{max-width:1180px;margin:0 auto}

/* top bar & scroll minimization */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line);margin-bottom:20px;
  transition:padding-top .18s ease,box-shadow .18s ease;
}
.top-row{
  max-width:1180px;margin:0 auto;display:flex;gap:16px 28px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding-bottom:10px;max-height:260px;opacity:1;overflow:hidden;
  transition:max-height .22s ease,opacity .16s ease,padding-bottom .18s ease;
}
.topbar.compact{padding-top:2px;box-shadow:0 3px 12px rgba(15,23,42,.08)}
.topbar.compact .top-row{
  max-height:0;opacity:0;padding-bottom:0;pointer-events:none;
}
.brand{display:flex;gap:10px;align-items:center;color:var(--brand);min-width:0}
.brand-logo{width:50px;height:50px;flex:0 0 auto;display:block;overflow:visible;border-radius:50%;background:transparent}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--ink);display:block;line-height:1.1}
.tripname{border:0;background:transparent;padding:2px 0;color:var(--muted);font-size:.88rem;width:min(260px,60vw);border-radius:4px}
.tripname:hover{background:var(--surface2)}
.sum{display:flex;gap:6px 22px;align-items:center;flex-wrap:wrap;min-width:0}
.sum-main{display:flex;flex-direction:column}
.sum-main .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sum-main strong{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.sum-bar{width:220px;max-width:100%}
.sum-bar .st{font-size:.82rem;margin-top:4px;display:block}
.sum-split{display:flex;gap:14px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.sum-split b{color:var(--ink);font-weight:600}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap;border-radius:8px 8px 0 0;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink);background:var(--surface2);border-bottom-color:var(--brand)}

main{max-width:1180px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card + .card{margin-top:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:16px;align-items:start}
.grid2 > .card{margin-top:0}
.split{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}

.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled,.x:disabled{opacity:.4;cursor:not-allowed}
.x{background:none;border:0;color:var(--muted);font-size:1.15rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface2);color:var(--ink)}
.link{background:none;border:0;color:var(--ink);text-decoration-color:var(--brand);padding:0;font-size:.85rem;text-decoration:underline}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.t-ts,.pill.t-char{background:var(--accent-soft);color:var(--accent)}
.pill.t-qs{background:var(--surface2)}
.pill.t-snack{background:var(--good-soft);color:var(--good)}
.pill.b-free{background:var(--good-soft);color:var(--good)}
.pill.b-child{background:var(--accent-soft);color:var(--accent)}
.pill.b-adult{background:var(--surface2);color:var(--ink)}
.pill.th-3{background:var(--bad-soft);color:var(--bad)}
.pill.th-2{background:var(--accent-soft);color:var(--accent)}
.pill.th-1{background:var(--good-soft);color:var(--good)}
.money-in{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.over > i{background:var(--bad)}
.good{color:var(--good)} .bad{color:var(--bad)}
.status{font-weight:600;font-size:.88rem}

/* budget rows */
.brow{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.brow:first-of-type{border-top:0;padding-top:0}
.brow-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.brow-n{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.tgt{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:.88rem}

/* forms */
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
.prow input[type=text]{flex:1 1 120px}
.age{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:.88rem}
.age input{width:64px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.fld small{font-size:.78rem}
.fld input[type=number],.fld select{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-top:12px}
.addon-block{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.addon-block:first-child{border-top:0;padding-top:0}
.addon-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.addon-top strong{font-size:.96rem;color:var(--ink)}
.addon-sub{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.addon-sub b{color:var(--ink)}

.drow{display:grid;grid-template-columns:auto repeat(auto-fit,minmax(130px,1fr)) auto;gap:10px 14px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.drow .dn{font-family:var(--f-display);font-weight:700;padding-bottom:7px;min-width:48px}
.drow select{width:100%}
.drow input[type=number]{width:100%}
.drow label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:560px}
th,td{text-align:right;padding:8px 10px;border-top:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0;font-weight:600}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tfoot td{font-weight:700;border-top:2px solid var(--line)}

/* dining */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--surface2);border:0;border-radius:99px;padding:5px 11px;font-size:.84rem;font-weight:500}
.chip.on{background:var(--brand);color:var(--on-brand)}
.catalog{display:grid;gap:8px;max-height:calc(100vh - var(--tb,150px) - 150px);overflow:auto;padding:2px 4px 2px 2px;min-height:120px}
@media (max-width:820px){.catalog{max-height:55vh}}
.sticky{position:sticky;top:calc(var(--tb,150px) + env(safe-area-inset-top,0px) + 14px)}
@media (max-width:820px){.sticky{position:static}}
.rcard{background:var(--surface2);border-radius:10px;padding:10px 12px;cursor:grab;display:grid;gap:4px;border:2px solid transparent}
.rcard.picked{border-color:var(--brand);background:var(--drop)}
.rcard.dragging{opacity:.5}
.rc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rc-top strong{font-weight:600}
.rc-meta{font-size:.84rem;color:var(--muted)}
.rc-meta b{color:var(--ink)}
.rc-note{font-size:.8rem;color:var(--muted)}
.pill.t-show{background:var(--accent-soft);color:var(--accent)}
.pill.est{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.pill.chk{background:var(--bad-soft);color:var(--bad)}
.add-rest{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.add-rest summary{cursor:pointer;font-weight:600;color:var(--ink)}
.add-rest .fgrid{margin-top:10px}
.add-rest input[type=text],.add-rest select{width:100%}
.edit{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.banner{background:var(--drop);color:var(--ink);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.dcard + .dcard{margin-top:14px}
.dc-h{display:flex;justify-content:space-between;gap:8px 16px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.dc-h .place{color:var(--muted);font-weight:500;margin-left:8px;font-family:var(--f-body);font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.slot{border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:110px;display:grid;align-content:start;gap:6px}
.slot.armed{border-color:var(--brand);cursor:pointer}
.slot.over{background:var(--drop);border-color:var(--brand)}
.slot-h{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slot .empty{color:var(--muted);font-size:.85rem}
.placed{background:var(--surface2);border-radius:8px;padding:9px 10px;cursor:grab;display:grid;gap:3px}
.placed strong{font-weight:600}
.placed .tot{font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.placed .pp{font-size:.8rem;color:var(--muted);display:grid;gap:1px}

/* rides + plan */
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ri{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:9px 10px;cursor:grab;flex-wrap:wrap;border:2px solid transparent}
.ri.over{border-color:var(--brand);background:var(--drop)}
.ri.dragging{opacity:.5}
.ri .rno{font-family:var(--f-display);font-weight:700;width:26px;text-align:center;color:var(--ink);font-size:1.1rem}
.ri-main{flex:1 1 160px;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ri-main strong{font-weight:600}
.ri-ctl{display:flex;gap:2px;align-items:center}
.endzone{border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px}
.endzone.over{background:var(--drop);border-color:var(--brand)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow input[type=text]{flex:1 1 160px}
.dtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.dtab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 14px;text-align:left;white-space:nowrap;font-weight:600;display:grid}
.dtab small{font-weight:400;color:var(--muted);font-size:.78rem}
.dtab.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.dtab.on small{color:var(--on-brand);opacity:.85}
.timeline{list-style:none;margin:0;padding:10px;display:grid;gap:8px;border:2px dashed var(--line);border-radius:12px;min-height:160px;align-content:start}
.timeline.over{background:var(--drop);border-color:var(--brand)}
.tl{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.tl-body{flex:1 1 140px;min-width:0;display:grid}
.tl-body strong{font-weight:600}
.tl-body span{font-size:.82rem;color:var(--muted)}
.badge{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted);min-width:58px;text-align:center}
.badge.ride{background:var(--brand);color:var(--on-brand)}
.badge.meal{background:var(--accent-soft);color:var(--accent)}
.badge.show{background:var(--good-soft);color:var(--good)}
.note{background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:8px;font-size:.88rem;margin-bottom:12px}
.tag{font-size:.72rem;background:var(--good-soft);color:var(--good);padding:2px 7px;border-radius:99px;font-weight:600}
.foot{max-width:1180px;margin:32px auto 0;color:var(--muted);font-size:.82rem;display:grid;gap:10px}
.foot-btns{display:flex;gap:8px;flex-wrap:wrap}
h1{font-size:1.8rem;font-weight:700;margin:0 0 4px}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.intro{margin-bottom:16px}
.intro ol{margin:8px 0 12px;padding-left:20px;display:grid;gap:4px}
.intro-note{font-size:.88rem;color:var(--muted);line-height:1.5}
.intro-note a{color:var(--ink);text-decoration-color:var(--brand);font-weight:600}
.intro-bar{display:flex;justify-content:flex-end;margin-bottom:12px}
.sum-tools{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.sum-tools p{flex:1 1 260px}
.sheet{display:grid;gap:24px}
.sheet h2{font-size:1.15rem;margin-bottom:8px}
.sheet table{min-width:0}
.sheet ol{margin:4px 0 0;padding-left:22px;display:grid;gap:2px}
.btable th:nth-child(2),.btable td:nth-child(2){text-align:right}
.etable th,.etable td{text-align:left;vertical-align:top}
.etable td:first-child{white-space:nowrap;width:1%}
.sday .costs{margin-bottom:8px}

/* lightning lane informational guide */
.llopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.llopt{background:var(--surface2);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.llopt h3{font-size:1.1rem}
.llopt ul,.llsteps{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.llopt .best{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.llopt .best b{color:var(--ink)}
.llsteps{gap:8px}
.llcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin-top:14px;align-items:start}
.llcol{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.llcol-h{display:grid;gap:2px}
.llcol-h small{color:var(--muted);font-size:.82rem;font-weight:600}
.llcol.c-single{border-top:4px solid var(--accent)}
.llcol.c-t1{border-top:4px solid var(--brand)}
.llcol.c-t2,.llcol.c-all{border-top:4px solid var(--good)}
.llitem{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:8px;padding:7px 10px;font-size:.9rem}
.llitem span.nm{flex:1 1 140px;min-width:0;font-weight:500}

/* crowd calendar (data file kept fresh by a daily GitHub Action) */
.ccal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:700px}
.ccal-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center;padding-bottom:2px}
.cday{background:var(--surface2);border-radius:10px;padding:6px;min-height:104px;display:grid;gap:3px;align-content:start}
.cday.blank{background:transparent}
.cday.today{outline:2px solid var(--brand)}
.cday .dnum{font-weight:600;font-size:.82rem;color:var(--muted)}
.cchip{display:flex;justify-content:space-between;gap:4px;font-size:.74rem;font-weight:600;border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.cl-1,.cl-2{background:var(--good-soft);color:var(--good)}
.cl-3{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.cl-4{background:var(--accent-soft);color:var(--accent)}
.cl-5{background:var(--bad-soft);color:var(--bad)}
.cnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.cnav strong{font-family:var(--f-display);font-size:1.15rem;min-width:150px;text-align:center}
.ckey{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:8px 0}
.ckey .cchip{display:inline-flex;gap:6px}

@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface2:#f1f1f1;--line:#bdbdbd;--ink:#000;--muted:#444;--brand:#000;--on-brand:#fff;--accent:#000;--accent-soft:#eee;--good:#000;--good-soft:#eee;--bad:#000;--bad-soft:#eee;--drop:#eee}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  body::before{display:none}
  .topbar,.foot,.no-print{display:none!important}
  main{max-width:none}
  .card{border:0;padding:0;border-radius:0}
  .sday{break-inside:avoid}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:no-preference){.bar > i{transition:width .3s ease}}
</style>
</head>

          var y = Math.floor(pIdx / w);
          var dist = Math.hypot(x - cx, y - cy);
          var r = px[i], g = px[i + 1], b = px[i + 2];
          var isPinkBg = (r > 215 && g > 165 && g < 215 && b > 170 && b < 220 && (r - g) > 25);
          if(dist > rad && isPinkBg){
            px[i + 3] = 0;
          }
        }
        ctx.putImageData(data, 0, 0);
        cvs.style.width = '48px';
        cvs.style.height = '48px';
        cvs.style.borderRadius = '50%';
        cvs.style.display = 'block';
        cvs.style.background = 'transparent';
        mount.innerHTML = '';
        mount.appendChild(cvs);
      }catch(e){
        idxSrc++;
        tryLoad();
      }
    };
    img.onerror = function(){
      idxSrc++;
      tryLoad();
    };
    img.src = sources[idxSrc];
  }
  tryLoad();
})();

/* ---------- calculations ---------- */
function ageBand(age){
  var n = +age;
  if(isNaN(n) || n < 3) return 'free';
  if(n < 10) return 'child';
  return 'adult';
}

function partyCounts(){
  var c = { total: (state.party || []).length, free: 0, child: 0, adult: 0 };
  (state.party || []).forEach(function(m){ c[ageBand(m.age)]++; });
  return c;
}

function allRest(){
  return R.concat((state.custom || []).filter(function(x){ return x.kind === 'rest' || !x.kind; }));
}

function restPrices(r){
  var ed = (state.edits && state.edits[r.id]) || {};
  return {
    adult: ed.adult != null ? +ed.adult : r.adult,
    kid: ed.kid != null ? +ed.kid : r.kid
  };
}

function mealCost(restId){
  if(!restId) return { total: 0, adultTotal: 0, kidTotal: 0, freeCount: 0 };
  var r = allRest().find(function(x){ return x.id === restId; });
  if(!r) return { total: 0, adultTotal: 0, kidTotal: 0, freeCount: 0 };
  var pr = restPrices(r);
  var c = partyCounts();
  var adultTotal = c.adult * pr.adult;
  var kidTotal = c.child * pr.kid;
  return { total: adultTotal + kidTotal, adultTotal: adultTotal, kidTotal: kidTotal, freeCount: c.free, rest: r, pr: pr };
}

function calcHotel(){
  var nights = Math.max(0, +state.hotelNights || 0);
  var rate = Math.max(0, +state.hotelNightly || 0);
  var tax = Math.max(0, +state.hotelTax || 0);
  return nights * rate * (1 + tax / 100);
}

function calcTickets(){
  var c = partyCounts();
  var paying = c.adult + c.child;
  var days = Math.max(0, +state.ticketDays || 0);
  var price = Math.max(0, +state.ticketPrice || 0);
  var tax = Math.max(0, +state.ticketTax || 0);
  return paying * days * price * (1 + tax / 100);
}

function calcDiningPlan(){
  if(!state.diningPlan || state.diningPlan === 'none') return 0;
  var nights = Math.max(0, +state.hotelNights || 0);
  var c = partyCounts();
  var adRate = Math.max(0, +state.diningPlanAdultRate || 0);
  var chRate = Math.max(0, +state.diningPlanChildRate || 0);
  return nights * (c.adult * adRate + c.child * chRate);
}

function calcAssignedMeals(){
  var sum = 0;
  (state.days || []).forEach(function(d){
    var mObj = (state.meals && state.meals[d.id]) || {};
    MEALS.forEach(function(m){ sum += mealCost(mObj[m]).total; });
  });
  return sum;
}

function calcDining(){
  return calcDiningPlan() + calcAssignedMeals();
}

function calcMemoryMaker(){
  if(!state.memoryMaker) return 0;
  return Math.max(0, +state.memoryMakerPrice || 0);
}

function calcLLAddon(){
  if(!state.llAddonType || state.llAddonType === 'none') return 0;
  var days = Math.max(0, +state.llAddonDays || 0);
  var rate = Math.max(0, +state.llAddonDailyRate || 0);
  var c = partyCounts();
  var paying = Math.max(1, c.adult + c.child);
  return days * rate * paying;
}

function calcExtras(){
  return calcMemoryMaker() + calcLLAddon();
}

function calcActuals(){
  var hotel = calcHotel();
  var tickets = calcTickets();
  var dining = calcDining();
  var extras = calcExtras();
  return {
    hotel: hotel,
    tickets: tickets,
    dining: dining,
    extras: extras,
    total: hotel + tickets + dining + extras
  };
}

function effectiveTargetTotal(){
  var t = state.targets || {};
  var sumCats = (+t.hotel || 0) + (+t.tickets || 0) + (+t.dining || 0) + (+t.extras || 0);
  return Math.max(+t.total || 0, sumCats);
}

function parkRides(park){
  var removed = (state.removedRides && state.removedRides[park]) || [];
  var base = (RIDES[park] || []).filter(function(r){ return removed.indexOf(r.id) === -1; });
  var customRides = (state.custom || []).filter(function(item){ return item.kind === 'ride' && item.park === park && removed.indexOf(item.id) === -1; });
  var all = base.concat(customRides);
  var byId = {};
  all.forEach(function(r){ byId[r.id] = r; });
  var ord = (state.priorities && state.priorities[park]) || [];
  var sorted = [];
  ord.forEach(function(id){ if(byId[id]){ sorted.push(byId[id]); delete byId[id]; } });
  Object.keys(byId).forEach(function(id){ sorted.push(byId[id]); });
  return sorted;
}

function syncTopBar(){
  var tb = q('#top');
  if(!tb) return;
  document.documentElement.style.setProperty('--tb', tb.offsetHeight + 'px');
}

var scrollRaf = null;
function onScroll(){
  if(scrollRaf) return;
  scrollRaf = window.requestAnimationFrame(function(){
    var tb = q('#top');
    if(tb){
      var y = window.scrollY || window.pageYOffset || 0;
      if(y > 48) tb.classList.add('compact');
      else tb.classList.remove('compact');
      syncTopBar();
    }
    scrollRaf = null;
  });
}

/* ---------- tab: crowd calendar (reads crowds.json, refreshed daily by a GitHub Action) ---------- */
var CROWD_DATA_URL = 'https://raw.githubusercontent.com/DecadesOfMagicTravel/wdw-crowds/main/crowds.json';
var CROWD_PARKS = [['mk', 'MK', 'Magic Kingdom'], ['ep', 'EP', 'EPCOT'], ['hs', 'HS', 'Hollywood Studios'], ['ak', 'AK', 'Animal Kingdom']];
var CROWD_LABEL = { 1: 'Light', 2: 'Below average', 3: 'Average', 4: 'Above average', 5: 'Heavy' };
var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function crowdState(){
  if(!ui.crowd) ui.crowd = { status: 'idle', data: null, month: null, error: '' };
  return ui.crowd;
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function monthKeyOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }

function loadCrowd(force){
  var c = crowdState();
  if(c.status === 'loading') return;
  if(!force && c.status !== 'idle') return;
  if(/YOUR-GITHUB-USER|YOUR-REPO/.test(CROWD_DATA_URL)){ c.status = 'setup'; return; }
  c.status = 'loading';
  fetch(CROWD_DATA_URL + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      if(!j || typeof j.days !== 'object') throw new Error('Unexpected file format');
      c.data = j; c.status = 'ok'; c.error = '';
      try{ localStorage.setItem(KEY + '-crowd', JSON.stringify(j)); }catch(e){}
    })
    .catch(function(err){
      c.error = String((err && err.message) || err);
      var cached = null;
      try{ cached = JSON.parse(localStorage.getItem(KEY + '-crowd') || 'null'); }catch(e){}
      if(cached && cached.days){ c.data = cached; c.status = 'cached'; }
      else c.status = 'error';
    })
    .then(function(){ if(state.tab === 'crowd') render(); });
}

function renderCrowd(){
  var c = crowdState();
  if(c.status === 'idle') loadCrowd(false);

  var head = '<div class="sec-h"><h2>Crowd calendar</h2>' +
    '<span class="hint">Predicted crowd level, 1 (light) to 5 (heavy)</span></div>';

  if(c.status === 'setup'){
    return '<div class="card">' + head +
      '<p class="note">One-time setup needed: open the planner file, find <b>CROWD_DATA_URL</b>, and replace <b>YOUR-GITHUB-USER</b> and <b>YOUR-REPO</b> with the GitHub account and repository that hold <b>crowds.json</b>.</p></div>';
  }
  if(c.status === 'loading' || c.status === 'idle'){
    return '<div class="card">' + head + '<p class="hint">Loading crowd predictions&hellip;</p></div>';
  }
  if(c.status === 'error'){
    return '<div class="card">' + head +
      '<p class="note">Could not load crowd data (' + esc(c.error) + ').</p>' +
      '<button class="btn sm" type="button" data-action="crowd-refresh">Try again</button></div>';
  }

  var days = (c.data && c.data.days) || {};
  var keys = Object.keys(days).sort();
  var now = new Date();
  var month = c.month || monthKeyOf(now);
  if(!c.month && keys.length && !keys.some(function(k){ return k.indexOf(month) === 0; })) month = keys[0].slice(0, 7);
  c.month = month;
  var y = +month.slice(0, 4), m = +month.slice(5, 7);
  var startDow = new Date(y, m - 1, 1).getDay();
  var dim = new Date(y, m, 0).getDate();
  var todayKey = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());

  var cells = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function(w){ return '<div class="ccal-h">' + w + '</div>'; }).join('');
  for(var b = 0; b < startDow; b++) cells += '<div class="cday blank"></div>';
  var anyInMonth = false;
  for(var d = 1; d <= dim; d++){
    var key = month + '-' + pad2(d);
    var rec = days[key];
    var chips = '';
    if(rec){
      CROWD_PARKS.forEach(function(p){
        var lv = +rec[p[0]];
        if(lv >= 1 && lv <= 5){
          anyInMonth = true;
          chips += '<div class="cchip cl-' + lv + '" title="' + esc(p[2] + ': ' + CROWD_LABEL[lv]) + '"><span>' + p[1] + '</span><span>' + lv + '</span></div>';
        }
      });
    }
    cells += '<div class="cday' + (key === todayKey ? ' today' : '') + '"><span class="dnum">' + d + '</span>' + chips + '</div>';
  }

  var upd = '';
  if(c.data && c.data.updated){
    var ud = new Date(c.data.updated);
    if(!isNaN(ud.getTime())) upd = 'Data last updated ' + ud.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + '. ';
  }
  var src = (c.data && c.data.source) ? 'Source: ' + esc(c.data.source) + '. ' : '';

  var key2 = CROWD_PARKS.map(function(p){ return '<span><b>' + p[1] + '</b> ' + esc(p[2]) + '</span>'; }).join('') +
    [1, 2, 3, 4, 5].map(function(n){ return '<span class="cchip cl-' + n + '"><b>' + n + '</b> ' + CROWD_LABEL[n] + '</span>'; }).join('');

  return '<div class="card">' + head +
    (c.status === 'cached' ? '<p class="note">Could not reach the latest data (' + esc(c.error) + '). Showing the last saved copy.</p>' : '') +
    (keys.length ? '' : '<p class="note">No predictions have been loaded yet. The daily update has not produced data.</p>') +
    '<div class="cnav">' +
      '<button class="btn ghost sm" type="button" data-action="crowd-prev" aria-label="Previous month">&larr;</button>' +
      '<strong>' + MONTH_NAMES[m - 1] + ' ' + y + '</strong>' +
      '<button class="btn ghost sm" type="button" data-action="crowd-next" aria-label="Next month">&rarr;</button>' +
      '<button class="btn ghost sm" type="button" data-action="crowd-refresh">Refresh</button>' +
    '</div>' +
    (keys.length && !anyInMonth ? '<p class="hint">No predictions for this month.</p>' : '') +
    '<div class="scroll"><div class="ccal">' + cells + '</div></div>' +
    '<div class="ckey">' + key2 + '</div>' +
    '<p class="hint">' + src + upd + 'Predictions are estimates and can change.</p>' +
  '</div>';
}

/* ---------- tab 5: day plan ---------- */
function currentDayObj(){
  if(!(state.days || []).length) return null;
  var found = state.days.find(function(d){ return d.id === state.activeDay; });
  return found || state.days[0];
}

function dayEntries(day){
  state.plans = state.plans || {};
  if(!Array.isArray(state.plans[day.id])) state.plans[day.id] = [];
  return state.plans[day.id];
}

function syncedMealItems(day){
  var mObj = (state.meals && state.meals[day.id]) || {};
  var out = [];
  MEALS.forEach(function(m){
    var rid = mObj[m];
    if(!rid) return;
    var r = allRest().find(function(x){ return x.id === rid; });
    if(!r) return;
    out.push({
      id: 'meal-' + day.id + '-' + m,
      kind: 'meal',
      time: MEAL_TIME[m] || '12:00',
      title: MEAL_LABEL[m] + ': ' + r.name,
      detail: r.loc + ' · ' + money(mealCost(rid).total)
    });
  });
  return out;
}

function renderPlan(){
  if(!(state.days || []).length){
    return '<div class="card">' +
      '<div class="sec-h"><h2>Day plan</h2><button class="btn sm" type="button" data-action="add-day">+ Add day</button></div>' +
      '<p class="hint">0 trip days scheduled yet. Add a day to build your itinerary.</p>' +
    '</div>';
  }
  var day = currentDayObj();
  var idx = state.days.indexOf(day);
  var customItems = dayEntries(day);
  var combined = syncedMealItems(day).concat(customItems).sort(function(a, b){
    return toMin(a.time) - toMin(b.time);
  });

  var dtabs = state.days.map(function(d, i){
    return '<button class="dtab' + (d.id === day.id ? ' on' : '') + '" type="button" data-active-day="' + d.id + '">Day ' + (i + 1) + '<small>' + esc(d.park) + ' &middot; ' + esc(fmtTime(d.start)) + '</small></button>';
  }).join('');

  var tlHtml = combined.length
    ? combined.map(function(ev){
        var isMeal = String(ev.id).indexOf('meal-') === 0;
        var k = ev.kind || 'note';
        var bClass = (k === 'ride' || k === 'meal' || k === 'show') ? k : '';
        return '<li class="tl" draggable="' + (!isMeal ? 'true' : 'false') + '" ' + (!isMeal ? 'data-plan-entry="' + ev.id + '"' : '') + '>' +
          '<span class="badge ' + bClass + '">' + esc(ENTRY_LABEL[k] || k) + '</span>' +
          (!isMeal
            ? '<input type="time" data-entry-time="' + ev.id + '" value="' + esc(ev.time || '09:00') + '" aria-label="Time">'
            : '<span class="hint" style="min-width:74px">' + esc(fmtTime(ev.time)) + '</span>') +
          '<div class="tl-body"><strong>' + esc(ev.title) + '</strong>' + (ev.detail ? '<span>' + esc(ev.detail) + '</span>' : '') + '</div>' +
          (!isMeal
            ? '<button class="x" type="button" data-del-plan-entry="' + ev.id + '" aria-label="Remove item">&times;</button>'
            : '<span class="pill">Dining slot</span>') +
        '</li>';
      }).join('')
    : '<li class="hint">0 itinerary items for Day ' + (idx + 1) + ' yet. Add a ride, show, break, travel, note, or meal below.</li>';

  var rideSuggs = parkRides(day.park).map(function(r){
    return '<option value="' + esc(r.name) + '">' + esc(r.name) + '</option>';
  }).join('');

  var noteText = (state.notes && state.notes[day.id]) || '';

  return '<div class="dtabs">' + dtabs + '</div>' +
    '<div class="card">' +
      '<div class="sec-h"><h2>Day ' + (idx + 1) + ' — ' + esc(day.park) + '</h2><span class="hint">Start ' + esc(fmtTime(day.start)) + '</span></div>' +
      '<div class="note">Meals assigned on the Dining tab appear here automatically alongside your custom schedule items.</div>' +
      '<ul class="timeline" id="dayTimeline">' + tlHtml + '</ul>' +
      '<div class="addrow">' +
        '<select id="entryKind">' +
          '<option value="ride">Ride</option>' +
          '<option value="meal">Meal</option>' +
          '<option value="show">Show</option>' +
          '<option value="break">Break</option>' +
          '<option value="travel">Travel</option>' +
          '<option value="note">Note</option>' +
        '</select>' +
        '<input type="time" id="entryTime" value="10:00">' +
        '<input type="text" id="entryTitle" list="parkRideList" placeholder="Attraction, meal, or note...">' +
        '<datalist id="parkRideList">' + rideSuggs + '</datalist>' +
        '<input type="text" id="entryDetail" placeholder="Optional details" style="max-width:200px">' +
        '<button class="btn sm" type="button" data-action="add-plan-item">Add item</button>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="sec-h"><h2>Day ' + (idx + 1) + ' notes</h2></div>' +
      '<textarea rows="3" data-day-notes placeholder="Notes for Day ' + (idx + 1) + '...">' + esc(noteText) + '</textarea>' +
    '</div>';
}

/* ---------- tab 6: summary ---------- */
function buildSummaryText(){
  var act = calcActuals();
  var bud = effectiveTargetTotal();
  var c = partyCounts();
  var lines = [];
  lines.push(state.trip || 'Decades of Magic WDW Trip');
  lines.push('Travelers: ' + c.total + ' (' + c.adult + ' Adult 10+, ' + c.child + ' Child 3–9, ' + c.free + ' Under 3)');
  if(state.selectedResort) lines.push('Resort: ' + state.selectedResort + ' (' + (+state.hotelNights || 0) + ' nights)');
  if(state.diningPlan && state.diningPlan !== 'none') lines.push('Dining Plan: ' + (DINING_PLANS[state.diningPlan] ? DINING_PLANS[state.diningPlan].label : state.diningPlan) + ' (' + money(calcDiningPlan()) + ')');
  if(state.memoryMaker) lines.push('Memory Maker: ' + money(calcMemoryMaker()));
  if(state.llAddonType && state.llAddonType !== 'none') lines.push('Lightning Lane: ' + (LL_ADDON_OPTIONS[state.llAddonType] ? LL_ADDON_OPTIONS[state.llAddonType].label : state.llAddonType) + ' (' + (+state.llAddonDays || 0) + ' days, ' + money(calcLLAddon()) + ')');
  lines.push('Estimated Total: ' + money(act.total) + (bud > 0 ? ' / Target: ' + money(bud) : ''));
  lines.push('Hotel: ' + money(act.hotel) + ' | Tickets: ' + money(act.tickets) + ' | Dining: ' + money(act.dining) + ' | Add-ons: ' + money(act.extras));
  (state.days || []).forEach(function(d, i){
    var mObj = (state.meals && state.meals[d.id]) || {};
    var mealList = MEALS.map(function(m){
      var rid = mObj[m];
      var r = rid ? allRest().find(function(x){ return x.id === rid; }) : null;
      return r ? MEAL_LABEL[m] + ': ' + r.name + ' (' + money(mealCost(rid).total) + ')' : null;
    }).filter(Boolean);
    lines.push('Day ' + (i + 1) + ' (' + d.park + ', start ' + fmtTime(d.start) + ')' + (mealList.length ? ' — ' + mealList.join('; ') : ''));
  });
  return lines.join('\n');
}

function renderSummary(){
  var act = calcActuals();
  var bud = effectiveTargetTotal();
  var c = partyCounts();

  var tableRows = [
    ['Hotel & resort', act.hotel, (state.targets && state.targets.hotel) || 0],
    ['Park tickets', act.tickets, (state.targets && state.targets.tickets) || 0],
    ['Dining (plan + meals)', act.dining, (state.targets && state.targets.dining) || 0],
    ['Optional add-ons (Memory Maker & Lightning Lane)', act.extras, (state.targets && state.targets.extras) || 0]
  ].map(function(r){
    return '<tr><td>' + esc(r[0]) + '</td><td>' + money(r[1]) + '</td><td>' + money(r[2]) + '</td></tr>';
  }).join('');

  var priSections = PARKS.map(function(pk){
    var list = parkRides(pk);
    return '<div><h3>' + esc(pk) + '</h3>' +
      (list.length
        ? '<ol>' + list.map(function(r){ return '<li>' + esc(r.name) + ' <span class="pill th-' + r.thrill + '">' + THRILL[r.thrill] + '</span></li>'; }).join('') + '</ol>'
        : '<p class="hint">0 rides prioritized.</p>') +
    '</div>';
  }).join('');

  var dayBlocks = (state.days || []).length
    ? state.days.map(function(d, i){
        var mObj = (state.meals && state.meals[d.id]) || {};
        var mSum = MEALS.reduce(function(s, m){ return s + mealCost(mObj[m]).total; }, 0);
        var assigned = MEALS.map(function(m){
          var rid = mObj[m];
          var r = rid ? allRest().find(function(x){ return x.id === rid; }) : null;
          return r ? MEAL_LABEL[m] + ': ' + r.name + ' (' + money(mealCost(rid).total) + ')' : null;
        }).filter(Boolean);
        return '<div class="sday">' +
          '<h3>Day ' + (i + 1) + ' — ' + esc(d.park) + '</h3>' +
          '<p class="costs hint">Start ' + esc(fmtTime(d.start)) + ' &middot; Meals ' + money(mSum) + '</p>' +
          (assigned.length ? '<ol>' + assigned.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>' : '<p class="hint">No meals assigned.</p>') +
        '</div>';
      }).join('')
    : '<p class="hint">0 trip days scheduled.</p>';

  return '<div class="card no-print">' +
      '<div class="sum-tools">' +
        '<p>Print or copy a summary of your trip costs, priorities, and days.</p>' +
        '<button class="btn ghost" type="button" data-action="copy-summary">' + (ui.copied ? 'Copied!' : 'Copy summary') + '</button>' +
        '<button class="btn" type="button" data-action="print-summary">Print / Save PDF</button>' +
      '</div>' +
    '</div>' +
    '<div class="card sheet">' +
      '<div>' +
        '<h1>' + esc(state.trip || 'Decades of Magic WDW Trip') + '</h1>' +
        '<p class="hint">' + pl(c.total, 'traveler') + ' (' + c.adult + ' Adult 10+, ' + c.child + ' Child 3–9, ' + c.free + ' Under 3)' +
          (state.selectedResort ? ' &middot; ' + esc(state.selectedResort) : '') +
          (state.memoryMaker ? ' &middot; Memory Maker (' + money(calcMemoryMaker()) + ')' : '') +
        '</p>' +
      '</div>' +
      '<div>' +
        '<h2>Budget breakdown</h2>' +
        '<table class="btable"><thead><tr><th>Category</th><th>Estimated</th><th>Target</th></tr></thead><tbody>' + tableRows + '</tbody><tfoot><tr><td>Total</td><td>' + money(act.total) + '</td><td>' + money(bud) + '</td></tr></tfoot></table>' +
      '</div>' +
      '<div>' +
        '<h2>Ride priorities</h2>' +
        '<div class="grid2" style="margin-top:8px">' + priSections + '</div>' +
      '</div>' +
      '<div>' +
        '<h2>Day-by-day overview</h2>' +
        dayBlocks +
      '</div>' +
    '</div>';
}

/* ---------- main render ---------- */
function render(){
  applyTheme();
  renderTop();
  renderIntroWrap();
  var view = q('#view');
  if(!view) return;
  if(state.tab === 'trip') view.innerHTML = renderTrip();
  else if(state.tab === 'dining') view.innerHTML = renderDining();
  else if(state.tab === 'rides') view.innerHTML = renderRides();
  else if(state.tab === 'll') view.innerHTML = renderLL();
  else if(state.tab === 'crowd') view.innerHTML = renderCrowd();
  else if(state.tab === 'plan') view.innerHTML = renderPlan();
  else view.innerHTML = renderSummary();
  syncTopBar();
}

/* ---------- event handling ---------- */
var dragState = { type: null, id: null, extra: null };

document.addEventListener('click', function(e){
  var t = e.target;

  var tabBtn = t.closest('[data-tab]');
  if(tabBtn){
    state.tab = tabBtn.getAttribute('data-tab');
    ui.notice = '';
    saveState();
    render();
    return;
  }

  var actBtn = t.closest('[data-action]');
  if(actBtn){
    var act = actBtn.getAttribute('data-action');
    if(act === 'hide-intro'){
      state.showIntro = false;
      saveState(); render();
    }else if(act === 'show-intro'){
      state.showIntro = true;
      saveState(); render();
    }else if(act === 'cycle-theme'){
      var order = ['auto', 'light', 'dark'];
      state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
      saveState(); render();
    }else if(act === 'add-day'){
      var pk = PLACES[state.days.length % PLACES.length];
      var newId = 'day-' + uid();
      state.days.push({ id: newId, park: pk, start: '09:00' });
      state.meals[newId] = { breakfast: null, lunch: null, dinner: null, snack: null };
      if(!state.activeDay) state.activeDay = newId;
      ui.notice = 'Added Day ' + state.days.length + ' (' + pk + ').';
      saveState(); render();
    }else if(act === 'reset-zero'){
      state = seedState();
      ui.pickedRest = null; ui.editingRest = null; ui.copied = false; ui.notice = 'Trip reset to zero.';
      saveState(); render();
    }else if(act === 'add-member'){
      state.party.push({ id: uid(), name: 'Traveler ' + (state.party.length + 1), age: 18 });
      saveState(); render();
    }else if(act === 'clear-picked'){
      ui.pickedRest = null; render();
    }else if(act === 'add-custom-rest'){
      var nm = (q('#newRestName') && q('#newRestName').value || '').trim();
      if(!nm) return;
      var loc = (q('#newRestLoc') && q('#newRestLoc').value) || 'Magic Kingdom';
      var tp = (q('#newRestType') && q('#newRestType').value) || 'qs';
      var ad = Math.max(0, +(q('#newRestAdult') && q('#newRestAdult').value) || 0);
      var kd = Math.max(0, +(q('#newRestKid') && q('#newRestKid').value) || 0);
      state.custom.push({ id: 'custom-' + uid(), kind: 'rest', name: nm, loc: loc, type: tp, adult: ad, kid: kd, e: false, c: false, n: 'Custom dining spot' });
      if(q('#newRestName')) q('#newRestName').value = '';
      saveState(); render();
    }else if(act === 'add-plan-item'){
      var dObj = currentDayObj();
      if(!dObj) return;
      var items = dayEntries(dObj);
      var title = (q('#entryTitle') && q('#entryTitle').value || '').trim();
      if(!title) return;
      var kind = (q('#entryKind') && q('#entryKind').value) || 'ride';
      var tm = (q('#entryTime') && q('#entryTime').value) || '10:00';
      var det = (q('#entryDetail') && q('#entryDetail').value || '').trim();
      items.push({ id: uid(), kind: kind, time: tm, title: title, detail: det });
      items.sort(function(a, b){ return toMin(a.time) - toMin(b.time); });
      saveState(); render();
    }else if(act === 'copy-summary'){
      var txt = buildSummaryText();
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); }catch(err){}
      document.body.removeChild(ta);
      ui.copied = true;
      render();
      setTimeout(function(){ ui.copied = false; if(state.tab === 'summary') render(); }, 1800);
    }else if(act === 'crowd-prev' || act === 'crowd-next'){
      var cs = crowdState();
      var cy = +(cs.month || monthKeyOf(new Date())).slice(0, 4), cm = +(cs.month || monthKeyOf(new Date())).slice(5, 7);
      cm += act === 'crowd-next' ? 1 : -1;
      if(cm < 1){ cm = 12; cy--; } else if(cm > 12){ cm = 1; cy++; }
      cs.month = cy + '-' + pad2(cm);
      render();
    }else if(act === 'crowd-refresh'){
      loadCrowd(true); render();
    }else if(act === 'print-summary'){
      window.print();
    }
    return;
  }

  var delCustomRest = t.closest('[data-del-custom-rest]');
  if(delCustomRest){
    e.stopPropagation();
    var crid = delCustomRest.getAttribute('data-del-custom-rest');
    state.custom = (state.custom || []).filter(function(x){ return x.id !== crid; });
    if(ui.pickedRest === crid) ui.pickedRest = null;
    if(ui.editingRest === crid) ui.editingRest = null;
    saveState(); render(); return;
  }

  var delMem = t.closest('[data-del-member]');
  if(delMem){
    var mid = delMem.getAttribute('data-del-member');
    state.party = state.party.filter(function(m){ return m.id !== mid; });
    saveState(); render(); return;
  }

  var delDay = t.closest('[data-del-day]');
  if(delDay){
    var did = delDay.getAttribute('data-del-day');
    state.days = state.days.filter(function(d){ return d.id !== did; });
    if(state.meals) delete state.meals[did];
    if(state.plans) delete state.plans[did];
    if(state.notes) delete state.notes[did];
    if(state.activeDay === did) state.activeDay = state.days[0] ? state.days[0].id : '';
    saveState(); render(); return;
  }

  var locChip = t.closest('[data-loc]');
  if(locChip){ ui.loc = locChip.getAttribute('data-loc'); render(); return; }

  var typeChip = t.closest('[data-type]');
  if(typeChip){ ui.type = typeChip.getAttribute('data-type'); render(); return; }

  var priChip = t.closest('[data-pri-park]');
  if(priChip){ ui.priPark = priChip.getAttribute('data-pri-park'); render(); return; }

  var editBtn = t.closest('[data-edit-rest]');
  if(editBtn){
    e.stopPropagation();
    var erid = editBtn.getAttribute('data-edit-rest');
    ui.editingRest = ui.editingRest === erid ? null : erid;
    render(); return;
  }

  var resetP = t.closest('[data-reset-price]');
  if(resetP){
    e.stopPropagation();
    var rpid = resetP.getAttribute('data-reset-price');
    if(state.edits) delete state.edits[rpid];
    saveState(); render(); return;
  }

  var clearSlot = t.closest('[data-clear-slot]');
  if(clearSlot){
    e.stopPropagation();
    var sp = clearSlot.getAttribute('data-clear-slot').split(':');
    if(state.meals && state.meals[sp[0]]) state.meals[sp[0]][sp[1]] = null;
    saveState(); render(); return;
  }

  var dropSlot = t.closest('[data-drop-slot]');
  if(dropSlot && ui.pickedRest){
    var dp = dropSlot.getAttribute('data-drop-slot').split(':');
    state.meals[dp[0]] = state.meals[dp[0]] || { breakfast: null, lunch: null, dinner: null, snack: null };
    state.meals[dp[0]][dp[1]] = ui.pickedRest;
    ui.pickedRest = null;
    saveState(); render(); return;
  }

  var pickCard = t.closest('[data-pick-rest]');
  if(pickCard && !t.closest('button') && !t.closest('input')){
    var prid = pickCard.getAttribute('data-pick-rest');
    ui.pickedRest = ui.pickedRest === prid ? null : prid;
    render(); return;
  }

  var moveBtn = t.closest('[data-move-ride]');
  if(moveBtn){
    var mp = moveBtn.getAttribute('data-move-ride').split(':');
    var pkName = mp[0], rid = mp[1], delta = +mp[2];
    var list = parkRides(pkName).map(function(x){ return x.id; });
    var pos = list.indexOf(rid);
    var nPos = pos + delta;
    if(pos > -1 && nPos >= 0 && nPos < list.length){
      var tmp = list[pos]; list[pos] = list[nPos]; list[nPos] = tmp;
      state.priorities[pkName] = list;
      saveState(); render();
    }
    return;
  }

  var remRideBtn = t.closest('[data-remove-ride]');
  if(remRideBtn){
    var rr = remRideBtn.getAttribute('data-remove-ride').split(':');
    var rPark = rr[0], rId = rr[1];
    state.custom = (state.custom || []).filter(function(item){ return !(item.kind === 'ride' && item.id === rId); });
    state.removedRides = state.removedRides || {};
    state.removedRides[rPark] = state.removedRides[rPark] || [];
    if(state.removedRides[rPark].indexOf(rId) === -1) state.removedRides[rPark].push(rId);
    state.priorities[rPark] = (state.priorities[rPark] || []).filter(function(id){ return id !== rId; });
    saveState(); render(); return;
  }

  var addRideBtn = t.closest('[data-add-ride]');
  if(addRideBtn){
    var rParkAdd = addRideBtn.getAttribute('data-add-ride');
    var nInp = q('[data-new-ride-name="' + CSS.escape(rParkAdd) + '"]');
    var tSel = q('[data-new-ride-thrill="' + CSS.escape(rParkAdd) + '"]');
    var rName = (nInp && nInp.value || '').trim();
    if(!rName) return;
    var rTh = +(tSel && tSel.value) || 2;
    var newId = slug(rParkAdd + ' ' + rName) + '-' + uid().slice(0, 3);
    state.custom.push({ id: newId, kind: 'ride', park: rParkAdd, name: rName, thrill: rTh });
    state.priorities[rParkAdd] = parkRides(rParkAdd).map(function(x){ return x.id; });
    saveState(); render(); return;
  }

  var llParkBtn = t.closest('[data-ll-park]');
  if(llParkBtn){ ui.llPark = llParkBtn.getAttribute('data-ll-park'); render(); return; }

  var actDayBtn = t.closest('[data-active-day]');
  if(actDayBtn){ state.activeDay = actDayBtn.getAttribute('data-active-day'); render(); return; }

  var delEntryBtn = t.closest('[data-del-plan-entry]');
  if(delEntryBtn){
    var eid = delEntryBtn.getAttribute('data-del-plan-entry');
    var dObj = currentDayObj();
    if(dObj && Array.isArray(state.plans && state.plans[dObj.id])){
      state.plans[dObj.id] = state.plans[dObj.id].filter(function(x){ return x.id !== eid; });
      saveState(); render();
    }
  }
});

document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id === 'tripName'){
    state.trip = t.value;
    saveState(); return;
  }
  if(t.hasAttribute('data-search-rest')){
    ui.search = t.value;
    render(); return;
  }
  if(t.hasAttribute('data-day-notes')){
    var dObj = currentDayObj();
    if(dObj){
      state.notes = state.notes || {};
      state.notes[dObj.id] = t.value;
      saveState();
    }
  }
});

document.addEventListener('change', function(e){
  var t = e.target;

  if(t.hasAttribute('data-target-total')){
    state.targets.total = Math.max(0, +t.value || 0);
    saveState(); render(); return;
  }
  if(t.hasAttribute('data-target-cat')){
    state.targets[t.getAttribute('data-target-cat')] = Math.max(0, +t.value || 0);
    saveState(); render(); return;
  }
  if(t.hasAttribute('data-member-name')){
    var mem = state.party.find(function(x){ return x.id === t.getAttribute('data-member-name'); });
    if(mem){ mem.name = t.value; saveState(); render(); }
    return;
  }
  if(t.hasAttribute('data-member-age')){
    var ma = state.party.find(function(x){ return x.id === t.getAttribute('data-member-age'); });
    if(ma){ ma.age = Math.max(0, Math.min(99, +t.value || 0)); saveState(); render(); }
    return;
  }
  if(t.hasAttribute('data-resort-select')){
    var resName = t.value;
    state.selectedResort = resName;
    if(resName){
      Object.keys(WDW_RESORTS).forEach(function(grp){
        WDW_RESORTS[grp].forEach(function(item){
          if(item.name === resName) state.hotelNightly = item.rate;
        });
      });
    }
    saveState(); render(); return;
  }
  if(t.hasAttribute('data-dining-plan')){
    var dpKey = t.value;
    state.diningPlan = dpKey;
    var dpPreset = DINING_PLANS[dpKey];
    if(dpPreset){
      state.diningPlanAdultRate = dpPreset.adultRate;
      state.diningPlanChildRate = dpPreset.childRate;
    }
    saveState(); render(); return;
  }
  if(t.hasAttribute('data-mm-check')){
    state.memoryMaker = !!t.checked;
    if(state.memoryMaker && (!state.memoryMakerPrice || +state.memoryMakerPrice <= 0)){
      state.memoryMakerPrice = 185;
    }
    saveState(); render(); return;
  }
  if(t.hasAttribute('data-ll-addon-select')){
    var llKey = t.value;
    state.llAddonType = llKey;
    var llOpt = LL_ADDON_OPTIONS[llKey];
    if(llOpt){
      state.llAddonDailyRate = llOpt.dailyRate;
      if(llKey !== 'none' && (!state.llAddonDays || +state.llAddonDays <= 0)){
        state.llAddonDays = Math.max(1, +state.ticketDays || 1);
      }
    }
    saveState(); render(); return;
  }
  if(t.hasAttribute('data-state-num')){
    var nf = t.getAttribute('data-state-num');
    state[nf] = Math.max(0, +t.value || 0);
    saveState(); render(); return;
  }
  if(t.hasAttribute('data-day-park')){
    var d = state.days.find(function(x){ return x.id === t.getAttribute('data-day-park'); });
    if(d){ d.park = t.value; if(state.plans) state.plans[d.id] = []; saveState(); render(); }
    return;
  }
  if(t.hasAttribute('data-day-start')){
    var ds = state.days.find(function(x){ return x.id === t.getAttribute('data-day-start'); });
    if(ds){ ds.start = t.value; saveState(); render(); }
    return;
  }
  if(t.hasAttribute('data-ov-adult') || t.hasAttribute('data-ov-kid')){
    var isAd = t.hasAttribute('data-ov-adult');
    var rid = t.getAttribute(isAd ? 'data-ov-adult' : 'data-ov-kid');
    var baseR = allRest().find(function(x){ return x.id === rid; });
    if(baseR){
      state.edits = state.edits || {};
      state.edits[rid] = state.edits[rid] || { adult: baseR.adult, kid: baseR.kid };
      if(isAd) state.edits[rid].adult = Math.max(0, +t.value || 0);
      else state.edits[rid].kid = Math.max(0, +t.value || 0);
      saveState(); render();
    }
    return;
  }
  if(t.hasAttribute('data-entry-time')){
    var eid = t.getAttribute('data-entry-time');
    var dObj = currentDayObj();
    if(dObj && Array.isArray(state.plans && state.plans[dObj.id])){
      var ev = state.plans[dObj.id].find(function(x){ return x.id === eid; });
      if(ev){
        ev.time = t.value;
        state.plans[dObj.id].sort(function(a, b){ return toMin(a.time) - toMin(b.time); });
        saveState(); render();
      }
    }
  }
});

/* drag & drop */
document.addEventListener('dragstart', function(e){
  var rc = e.target.closest('[data-drag-rest]');
  if(rc){ dragState = { type: 'rest', id: rc.getAttribute('data-drag-rest') }; rc.classList.add('dragging'); return; }
  var pc = e.target.closest('[data-drag-placed]');
  if(pc){ dragState = { type: 'placed', id: pc.getAttribute('data-drag-placed') }; return; }
  var ri = e.target.closest('[data-ride-id]');
  if(ri){ dragState = { type: 'ride', id: ri.getAttribute('data-ride-id'), extra: ri.getAttribute('data-ride-park') }; ri.classList.add('dragging'); return; }
  var pi = e.target.closest('[data-plan-entry]');
  if(pi){ dragState = { type: 'entry', id: pi.getAttribute('data-plan-entry') }; }
});

document.addEventListener('dragover', function(e){
  var dz = e.target.closest('[data-drop-slot],[data-ride-id],[data-ride-end],[data-plan-entry],#dayTimeline');
  if(dz){ e.preventDefault(); dz.classList.add('over'); }
});

document.addEventListener('dragleave', function(e){
  var dz = e.target.closest('[data-drop-slot],[data-ride-id],[data-ride-end],[data-plan-entry],#dayTimeline');
  if(dz) dz.classList.remove('over');
});

document.addEventListener('drop', function(e){
  var dz = e.target.closest('[data-drop-slot],[data-ride-id],[data-ride-end],[data-plan-entry],#dayTimeline');
  if(!dz) return;
  e.preventDefault();
  dz.classList.remove('over');

  if(dz.hasAttribute('data-drop-slot') && (dragState.type === 'rest' || dragState.type === 'placed')){
    var parts = dz.getAttribute('data-drop-slot').split(':');
    state.meals[parts[0]] = state.meals[parts[0]] || { breakfast: null, lunch: null, dinner: null, snack: null };
    if(dragState.type === 'rest'){
      state.meals[parts[0]][parts[1]] = dragState.id;
    }else if(dragState.type === 'placed'){
      var sp = dragState.id.split(':');
      if(state.meals[sp[0]]){
        var moved = state.meals[sp[0]][sp[1]];
        state.meals[parts[0]][parts[1]] = moved;
        if(sp[0] !== parts[0] || sp[1] !== parts[1]) state.meals[sp[0]][sp[1]] = null;
      }
    }
    dragState = { type: null, id: null };
    saveState(); render(); return;
  }

  if(dragState.type === 'ride' && (dz.hasAttribute('data-ride-id') || dz.hasAttribute('data-ride-end'))){
    var pName = dz.getAttribute('data-ride-park') || dz.getAttribute('data-ride-end');
    if(pName && pName === dragState.extra){
      var list = parkRides(pName).map(function(x){ return x.id; });
      var fIdx = list.indexOf(dragState.id);
      if(fIdx > -1){
        list.splice(fIdx, 1);
        if(dz.hasAttribute('data-ride-end')) list.push(dragState.id);
        else{
          var tIdx = list.indexOf(dz.getAttribute('data-ride-id'));
          list.splice(Math.max(0, tIdx), 0, dragState.id);
        }
        state.priorities[pName] = list;
        saveState(); render();
      }
    }
    dragState = { type: null, id: null }; return;
  }

  if(dragState.type === 'entry' && (dz.hasAttribute('data-plan-entry') || dz.id === 'dayTimeline')){
    var dObj = currentDayObj();
    if(dObj && Array.isArray(state.plans && state.plans[dObj.id])){
      var arr = state.plans[dObj.id];
      var efIdx = arr.findIndex(function(x){ return x.id === dragState.id; });
      if(efIdx > -1){
        var item = arr.splice(efIdx, 1)[0];
        if(dz.hasAttribute('data-plan-entry')){
          var etIdx = arr.findIndex(function(x){ return x.id === dz.getAttribute('data-plan-entry'); });
          arr.splice(Math.max(0, etIdx), 0, item);
        }else{
          arr.push(item);
        }
        saveState(); render();
      }
    }
    dragState = { type: null, id: null };
  }
});

document.addEventListener('dragend', function(){
  document.querySelectorAll('.dragging,.over').forEach(function(el){ el.classList.remove('dragging', 'over'); });
  dragState = { type: null, id: null };
});

window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', syncTopBar);

render();
})();
</script>
