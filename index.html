<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Decades of Magic WDW Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=Pacifico&display=swap">
<style>
/* Layout concept: a sticky budget bar over six working tabs (trip & budget, dining, ride priorities, lightning lane, day plan, summary); drag cards onto slots, or tap to pick then tap to place. */
:root{
  --bg:#F1F4FA; --surface:#FFFFFF; --surface2:#E8EDF7; --line:#D3DBEA;
  --ink:#15213F; --muted:#56637F;
  --brand:#45D1CB; --on-brand:#15213F;
  --accent:#A85A06; --accent-soft:#FCE9D2;
  --good:#13774B; --good-soft:#D9F1E5;
  --bad:#B8322A; --bad-soft:#FADFDC;
  --drop:#6DECE0;
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1630; --surface:#172246; --surface2:#1F2D59; --line:#2D3C6C;
    --ink:#E9EEFB; --muted:#A3AFCF;
    --brand:#45D1CB; --on-brand:#0E1630;
    --accent:#F2A650; --accent-soft:#3B2C16;
    --good:#4CC38A; --good-soft:#163A2C;
    --bad:#FF8577; --bad-soft:#44201D;
    --drop:#1B4D5C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#172246; --surface2:#1F2D59; --line:#2D3C6C;
  --ink:#E9EEFB; --muted:#A3AFCF;
  --brand:#45D1CB; --on-brand:#0E1630;
  --accent:#F2A650; --accent-soft:#3B2C16;
  --good:#4CC38A; --good-soft:#163A2C;
  --bad:#FF8577; --bad-soft:#44201D;
  --drop:#1B4D5C; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
input[type=number]{width:92px;font-variant-numeric:tabular-nums}
input[type=time]{width:112px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted,.hint{color:var(--muted)}
.hint{font-size:.85rem}
.wrap{max-width:1180px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top-row{max-width:1180px;margin:0 auto;display:flex;gap:16px 28px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:10px}
.brand{display:flex;gap:10px;align-items:center;color:var(--brand);min-width:0}
.brand-logo{width:46px;height:46px;flex:0 0 auto;display:block;overflow:visible}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--ink);display:block;line-height:1.1}
.tripname{border:0;background:transparent;padding:2px 0;color:var(--muted);font-size:.88rem;width:min(260px,60vw);border-radius:4px}
.tripname:hover{background:var(--surface2)}
.sum{display:flex;gap:6px 22px;align-items:center;flex-wrap:wrap;min-width:0}
.sum-main{display:flex;flex-direction:column}
.sum-main .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sum-main strong{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.sum-bar{width:220px;max-width:100%}
.sum-bar .st{font-size:.82rem;margin-top:4px;display:block}
.sum-split{display:flex;gap:14px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.sum-split b{color:var(--ink);font-weight:600}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background-color .16s ease,color .16s ease,border-color .16s ease}
.tab[aria-selected=true]{color:var(--ink);background:var(--drop);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink);background:var(--surface2);border-bottom-color:var(--brand)}

main{max-width:1180px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card + .card{margin-top:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:16px;align-items:start}
.grid2 > .card{margin-top:0}
.split{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}

.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled,.x:disabled{opacity:.4;cursor:not-allowed}
.x{background:none;border:0;color:var(--muted);font-size:1.15rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface2);color:var(--ink)}
.link{background:none;border:0;color:var(--ink);text-decoration-color:var(--brand);padding:0;font-size:.85rem;text-decoration:underline}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.t-ts,.pill.t-char{background:var(--accent-soft);color:var(--accent)}
.pill.t-qs{background:var(--surface2)}
.pill.t-snack{background:var(--good-soft);color:var(--good)}
.pill.b-free{background:var(--good-soft);color:var(--good)}
.pill.b-child{background:var(--accent-soft);color:var(--accent)}
.pill.b-adult{background:var(--surface2);color:var(--ink)}
.pill.th-3{background:var(--bad-soft);color:var(--bad)}
.pill.th-2{background:var(--accent-soft);color:var(--accent)}
.pill.th-1{background:var(--good-soft);color:var(--good)}
.money-in{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.over > i{background:var(--bad)}
.good{color:var(--good)} .bad{color:var(--bad)}
.status{font-weight:600;font-size:.88rem}

/* budget rows */
.brow{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.brow:first-of-type{border-top:0;padding-top:0}
.brow-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.brow-n{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.tgt{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:.88rem}

/* forms */
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
.prow input[type=text]{flex:1 1 120px}
.age{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:.88rem}
.age input{width:64px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.fld small{font-size:.78rem}
.fld input[type=number]{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-top:12px}
.drow{display:grid;grid-template-columns:auto repeat(auto-fit,minmax(130px,1fr)) auto;gap:10px 14px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.drow .dn{font-family:var(--f-display);font-weight:700;padding-bottom:7px;min-width:48px}
.drow select{width:100%}
.drow input[type=number]{width:100%}
.drow label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:560px}
th,td{text-align:right;padding:8px 10px;border-top:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0;font-weight:600}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tfoot td{font-weight:700;border-top:2px solid var(--line)}

/* dining */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--surface2);border:0;border-radius:99px;padding:5px 11px;font-size:.84rem;font-weight:500}
.chip.on{background:var(--brand);color:var(--on-brand)}
.catalog{display:grid;gap:8px;max-height:calc(100vh - var(--tb,150px) - 150px);overflow:auto;padding:2px 4px 2px 2px;min-height:120px}
@media (max-width:820px){.catalog{max-height:55vh}}
.sticky{position:sticky;top:calc(var(--tb,150px) + env(safe-area-inset-top,0px) + 14px)}
@media (max-width:820px){.sticky{position:static}}
.rcard{background:var(--surface2);border-radius:10px;padding:10px 12px;cursor:grab;display:grid;gap:4px;border:2px solid transparent}
.rcard.picked{border-color:var(--brand);background:var(--drop)}
.rcard.dragging{opacity:.5}
.rc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rc-top strong{font-weight:600}
.rc-meta{font-size:.84rem;color:var(--muted)}
.rc-meta b{color:var(--ink)}
.rc-note{font-size:.8rem;color:var(--muted)}
.pill.t-show{background:var(--accent-soft);color:var(--accent)}
.pill.est{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.pill.chk{background:var(--bad-soft);color:var(--bad)}
.add-rest{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.add-rest summary{cursor:pointer;font-weight:600;color:var(--ink)}
.add-rest .fgrid{margin-top:10px}
.add-rest input[type=text],.add-rest select{width:100%}
.edit{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.banner{background:var(--drop);color:var(--ink);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.dcard + .dcard{margin-top:14px}
.dc-h{display:flex;justify-content:space-between;gap:8px 16px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.dc-h .place{color:var(--muted);font-weight:500;margin-left:8px;font-family:var(--f-body);font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.slot{border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:110px;display:grid;align-content:start;gap:6px}
.slot.armed{border-color:var(--brand);cursor:pointer}
.slot.over{background:var(--drop);border-color:var(--brand)}
.slot-h{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slot .empty{color:var(--muted);font-size:.85rem}
.placed{background:var(--surface2);border-radius:8px;padding:9px 10px;cursor:grab;display:grid;gap:3px}
.placed strong{font-weight:600}
.placed .tot{font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.placed .pp{font-size:.8rem;color:var(--muted);display:grid;gap:1px}

/* rides + plan */
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ri{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:9px 10px;cursor:grab;flex-wrap:wrap;border:2px solid transparent}
.ri.over{border-color:var(--brand);background:var(--drop)}
.ri.dragging{opacity:.5}
.ri .rno{font-family:var(--f-display);font-weight:700;width:26px;text-align:center;color:var(--ink);font-size:1.1rem}
.ri-main{flex:1 1 160px;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ri-main strong{font-weight:600}
.ri-ctl{display:flex;gap:2px}
.ri select{padding:5px 7px;font-size:.85rem}
.endzone{border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px}
.endzone.over{background:var(--drop);border-color:var(--brand)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow input[type=text]{flex:1 1 160px}
.dtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.dtab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 14px;text-align:left;white-space:nowrap;font-weight:600;display:grid}
.dtab small{font-weight:400;color:var(--muted);font-size:.78rem}
.dtab.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.dtab.on small{color:var(--on-brand);opacity:.85}
.timeline{list-style:none;margin:0;padding:10px;display:grid;gap:8px;border:2px dashed var(--line);border-radius:12px;min-height:160px;align-content:start}
.timeline.over{background:var(--drop);border-color:var(--brand)}
.tl{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.tl-body{flex:1 1 140px;min-width:0;display:grid}
.tl-body strong{font-weight:600}
.tl-body span{font-size:.82rem;color:var(--muted)}
.badge{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted);min-width:58px;text-align:center}
.badge.ride{background:var(--brand);color:var(--on-brand)}
.badge.meal{background:var(--accent-soft);color:var(--accent)}
.badge.show{background:var(--good-soft);color:var(--good)}
.note{background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:8px;font-size:.88rem;margin-bottom:12px}
.tag{font-size:.72rem;background:var(--good-soft);color:var(--good);padding:2px 7px;border-radius:99px;font-weight:600}
.foot{max-width:1180px;margin:32px auto 0;color:var(--muted);font-size:.82rem;display:grid;gap:10px}
.foot-btns{display:flex;gap:8px;flex-wrap:wrap}
h1{font-size:1.8rem;font-weight:700;margin:0 0 4px}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.intro ol{margin:8px 0 14px;padding-left:20px;display:grid;gap:4px}
.sum-tools{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.sum-tools p{flex:1 1 260px}
.sheet{display:grid;gap:24px}
.sheet h2{font-size:1.15rem;margin-bottom:8px}
.sheet table{min-width:0}
.sheet ol{margin:4px 0 0;padding-left:22px;display:grid;gap:2px}
.btable th:nth-child(2),.btable td:nth-child(2){text-align:right}
.etable th,.etable td{text-align:left;vertical-align:top}
.etable td:first-child{white-space:nowrap;width:1%}
.sday .costs{margin-bottom:8px}
/* lightning lane guide */
.llopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.llopt{background:var(--surface2);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.llopt h3{font-size:1.1rem}
.llopt .price{font-family:var(--f-display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.llopt ul,.llsteps{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.llopt .best{font-size:.84rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.llopt .best b{color:var(--ink)}
.llsteps{gap:8px}
.llcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin-top:14px;align-items:start}
.llcol{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.llcol-h{display:grid;gap:2px}
.llcol-h small{color:var(--muted);font-size:.8rem}
.llcol.c-single{border-top:4px solid var(--accent)}
.llcol.c-t1{border-top:4px solid var(--brand)}
.llcol.c-t2,.llcol.c-all{border-top:4px solid var(--good)}
.llitem{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--surface2);border-radius:8px;padding:7px 10px;font-size:.9rem}
.llitem span.nm{flex:1 1 140px;min-width:0;font-weight:500}
.llitem small{flex-basis:100%;color:var(--muted);font-size:.78rem}
.pill.p-single{background:var(--accent-soft);color:var(--accent)}
.pill.p-t1{background:var(--drop);color:var(--ink)}
.pill.p-t2,.pill.p-all{background:var(--good-soft);color:var(--good)}
.llcheck td:nth-child(3),.llcheck th:nth-child(3),.llcheck td:nth-child(4),.llcheck th:nth-child(4){text-align:left}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface2:#f1f1f1;--line:#bdbdbd;--ink:#000;--muted:#444;--brand:#000;--on-brand:#fff;--accent:#000;--accent-soft:#eee;--good:#000;--good-soft:#eee;--bad:#000;--bad-soft:#eee;--drop:#eee}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  body::before{display:none}
  .topbar,.foot,.no-print{display:none!important}
  main{max-width:none}
  .card{border:0;padding:0;border-radius:0}
  .sday{break-inside:avoid}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:no-preference){.bar > i{transition:width .3s ease}}
</style>

      <svg class="brand-logo" viewBox="0 0 120 120" width="46" height="46" role="img" aria-label="Decades of Magic Travel Agency logo">

        <text fill="#26B8B4" font-family="'DM Sans',system-ui,sans-serif" font-size="7.6" font-weight="600" letter-spacing="3.2">

          <textPath href="#domBotArc" startOffset="50%" text-anchor="middle">AGENCY</textPath>
        </text>
        <!-- Script lettering with subtle offset shadow -->
        <g font-family="'Pacifico',cursive" text-anchor="middle" dominant-baseline="central">
          <text x="61.2" y="45.6" font-size="14.5" fill="#2A9A98" transform="rotate(-5 61.2 45.6)">Decades</text>
          <text x="60.9" y="61.2" font-size="11.2" fill="#2A9A98" transform="rotate(-4 60.9 61.2)">of</text>
          <text x="61.2" y="77.2" font-size="16.2" fill="#2A9A98" transform="rotate(-4 61.2 77.2)">Magic</text>

          <text x="60" y="44.2" font-size="14.5" fill="#45D1CB" transform="rotate(-5 60 44.2)">Decades</text>
          <text x="60" y="59.8" font-size="11.2" fill="#45D1CB" transform="rotate(-4 60 59.8)">of</text>

/* ---------- calculations ---------- */
function ageBand(age){
  var n=+age;
  if(isNaN(n)||n<3) return 'free';
  if(n<10) return 'child';
  return 'adult';
}

function partyCounts(){
  var out={total:state.party.length,free:0,child:0,adult:0};
  state.party.forEach(function(m){out[ageBand(m.age)]++;});
  return out;
}

function restPrices(r){
  var ov=(state.priceOverrides&&state.priceOverrides[r.id])||{};
  return {
    adult:ov.adult!=null?+ov.adult:r.adult,
    kid:ov.kid!=null?+ov.kid:r.kid
  };
}

function mealCost(restId){
  if(!restId) return {total:0,adultTotal:0,kidTotal:0,freeCount:0};
  var r=allRest().find(function(x){return x.id===restId;});
  if(!r) return {total:0,adultTotal:0,kidTotal:0,freeCount:0};
  var pr=restPrices(r);
  var c=partyCounts();
  var adultTotal=c.adult*pr.adult;
  var kidTotal=c.child*pr.kid;
  return {total:adultTotal+kidTotal,adultTotal:adultTotal,kidTotal:kidTotal,freeCount:c.free,rest:r,pr:pr};
}

function calcHotel(){
  return Math.max(0,(+state.hotel.perNight||0)*(+state.hotel.nights||0)+(+state.hotel.other||0));
}

function calcTickets(){
  var c=partyCounts();
  var paying=c.adult+c.child;
  var perDay=(+state.tickets.dayPrice||0)+(state.tickets.hopper?35:0);
  return Math.max(0,paying*(+state.tickets.days||0)*perDay);
}

function calcDining(){
  var sum=0;
  state.days.forEach(function(d){
    MEALS.forEach(function(m){
      sum+=mealCost(d.meals&&d.meals[m]).total;
    });
  });
  return sum;
}

function calcLL(){
  var c=partyCounts();
  var paying=c.adult+c.child;
  var total=0;
  state.days.forEach(function(d){
    if(d.llMulti){
      total+=paying*(DEF_MULTI[d.park]||28);
    }
    (d.llSingle||[]).forEach(function(rid){
      total+=paying*(SINGLE_PRICE[rid]||18);
    });
  });
  return total;
}

function calcActuals(){
  return {
    hotel:calcHotel(),
    tickets:calcTickets(),
    dining:calcDining(),
    ll:calcLL()
  };
}

function totalBudget(){
  return Object.keys(state.budgets).reduce(function(acc,k){return acc+(+state.budgets[k]||0);},0);
}

function totalSpent(act){
  return act.hotel+act.tickets+act.dining+act.ll;
}

function parkRides(park){
  var base=(RIDES[park]||[]).slice();
  var custom=(state.customRides&&state.customRides[park])||[];
  var all=base.concat(custom);
  var byId={};
  all.forEach(function(r){byId[r.id]=r;});
  var ord=(state.rideOrder&&state.rideOrder[park])||[];
  var sorted=[];
  ord.forEach(function(id){if(byId[id]){sorted.push(byId[id]);delete byId[id];}});
  Object.keys(byId).forEach(function(id){sorted.push(byId[id]);});
  return sorted;
}

  var root=document.documentElement;
  if(state.theme==='dark') root.setAttribute('data-theme','dark');

}

    return '<button class="tab" role="tab" aria-selected="'+sel+'" data-tab="'+t[0]+'">'+esc(t[1])+'</button>';

  q('#foot').innerHTML=

    '<p>Estimates are editable starting points for planning. Saved automatically in your browser.</p>';

  var tb=q('.topbar');
  if(tb) document.documentElement.style.setProperty('--tb',tb.offsetHeight+'px');
}

/* ---------- tab 5: day plan ---------- */
function ensureDayEntries(day){
  if(!Array.isArray(day.entries)) day.entries=[];
  if(day.entries.length===0){
    var cursor=toMin(day.start||'09:00');
    var rides=parkRides(day.park).slice(0,3);
    rides.forEach(function(r){
      day.entries.push({id:uid(),kind:'ride',time:fromMin(cursor),title:r.name,detail:PLAN_LABEL[(state.ridePlans&&state.ridePlans[day.park]&&state.ridePlans[day.park][r.id])||'standby']});
      cursor+=55;
    });
    MEALS.forEach(function(m){
      var rid=day.meals&&day.meals[m];
      var rest=rid?allRest().find(function(x){return x.id===rid;}):null;
      if(rest){
        day.entries.push({id:uid(),kind:'meal',time:MEAL_TIME[m],title:rest.name,detail:MEAL_LABEL[m]+' · '+rest.loc});
      }
    });
    day.entries.sort(function(a,b){return toMin(a.time)-toMin(b.time);});
  }
}

  var daysSummary=state.days.map(function(d,i){
    var mSum=MEALS.reduce(function(s,m){return s+mealCost(d.meals&&d.meals[m]).total;},0);
    var mealList=MEALS.map(function(m){
      var rid=d.meals&&d.meals[m];
      var r=rid?allRest().find(function(x){return x.id===rid;}):null;
      return r?MEAL_LABEL[m]+': '+r.name+' ('+money(mealCost(rid).total)+')':null;
    }).filter(Boolean);

    return '<div class="sday">'+
      '<h3>Day '+(i+1)+' — '+esc(d.park)+'</h3>'+
      '<p class="costs hint">Start '+esc(fmtTime(d.start))+' &middot; Dining '+money(mSum)+(d.llMulti?' &middot; Multi Pass':'')+'</p>'+
      (mealList.length?'<ol>'+mealList.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>':'<p class="hint">No meals assigned yet.</p>')+
    '</div>';
  }).join('');

  return '<div class="card no-print">'+
      '<div class="sum-tools">'+
        '<p>Review your full trip budget, party roster, and day-by-day schedule. Print or save as PDF anytime.</p>'+
        '<button class="btn" type="button" data-action="print-summary">Print / Save PDF</button>'+
      '</div>'+
    '</div>'+
    '<div class="card sheet">'+
      '<div>'+
        '<h1>'+esc(state.trip||'Disney Trip')+'</h1>'+
        '<p class="hint">'+pl(c.total,'traveler')+' ('+c.adult+' adult, '+c.child+' child, '+c.free+' under 3) &middot; '+pl(state.days.length,'day')+'</p>'+
      '</div>'+
      '<div>'+
        '<h2>Budget summary</h2>'+
        '<table class="btable"><thead><tr><th>Category</th><th>Estimated</th><th>Target</th></tr></thead><tbody>'+bRows+'</tbody><tfoot><tr><td>Total</td><td>'+money(spent)+'</td><td>'+money(bud)+'</td></tr></tfoot></table>'+
      '</div>'+
      '<div>'+
        '<h2>Daily overview</h2>'+
        daysSummary+
      '</div>'+
      (state.notes?'<div><h2>Notes</h2><p>'+esc(state.notes)+'</p></div>':'')+
    '</div>';
}

/* ---------- main view render ---------- */
function render(){
  applyTheme();
  renderTop();
  var v=q('#view');
  if(!v) return;
  if(state.tab==='trip') v.innerHTML=renderTrip();
  else if(state.tab==='dining') v.innerHTML=renderDining();
  else if(state.tab==='rides') v.innerHTML=renderRides();
  else if(state.tab==='ll') v.innerHTML=renderLL();
  else if(state.tab==='plan') v.innerHTML=renderPlan();
  else v.innerHTML=renderSummary();
}

/* ---------- events & interactions ---------- */
var dragState={type:null,id:null,extra:null};

document.addEventListener('click',function(e){
  var t=e.target;

  var tabBtn=t.closest('[data-tab]');
  if(tabBtn){
    state.tab=tabBtn.getAttribute('data-tab');
    saveState();
    render();
    return;
  }

  var actBtn=t.closest('[data-action]');
  if(actBtn){
    var act=actBtn.getAttribute('data-action');
    if(act==='cycle-theme'){
      var seq=['auto','light','dark'];
      state.theme=seq[(seq.indexOf(state.theme)+1)%seq.length];
      saveState();render();
    }else if(act==='add-day'){
      var nextPark=PLACES[state.days.length%PLACES.length];
      state.days.push({id:uid(),park:nextPark,start:'09:00',llMulti:PARKS.indexOf(nextPark)!==-1,llSingle:[],meals:{breakfast:null,lunch:null,dinner:null,snack:null},entries:[]});
      saveState();render();
    }else if(act==='reset-demo'){
      state=seedState();
      ui.pickedRest=null;ui.editingRest=null;ui.planDay=0;
      saveState();render();
    }else if(act==='add-member'){
      state.party.push({id:uid(),name:'Guest '+(state.party.length+1),age:18});
      saveState();render();
    }else if(act==='clear-picked'){
      ui.pickedRest=null;render();
    }else if(act==='add-custom-rest'){
      var nm=(q('#newRestName')&&q('#newRestName').value||'').trim();
      if(!nm) return;
      var loc=(q('#newRestLoc')&&q('#newRestLoc').value)||'Magic Kingdom';
      var tp=(q('#newRestType')&&q('#newRestType').value)||'qs';
      var ad=Math.max(0,+(q('#newRestAdult')&&q('#newRestAdult').value)||0);
      var kd=Math.max(0,+(q('#newRestKid')&&q('#newRestKid').value)||0);
      state.custom=state.custom||[];
      state.custom.push({id:'custom-'+uid(),name:nm,loc:loc,type:tp,adult:ad,kid:kd,e:false,c:false,n:'Custom entry'});
      if(q('#newRestName')) q('#newRestName').value='';
      saveState();render();
    }else if(act==='add-entry'){
      var idx=Math.max(0,Math.min(state.days.length-1,ui.planDay||0));
      var day=state.days[idx];
      ensureDayEntries(day);
      var title=(q('#newEntryTitle')&&q('#newEntryTitle').value||'').trim();
      if(!title) return;
      var kind=(q('#newEntryKind')&&q('#newEntryKind').value)||'note';
      var tm=(q('#newEntryTime')&&q('#newEntryTime').value)||'12:00';
      var det=(q('#newEntryDetail')&&q('#newEntryDetail').value||'').trim();
      day.entries.push({id:uid(),kind:kind,time:tm,title:title,detail:det});
      day.entries.sort(function(a,b){return toMin(a.time)-toMin(b.time);});
      saveState();render();
    }else if(act==='print-summary'){
      window.print();
    }
    return;
  }

  var delMem=t.closest('[data-del-member]');
  if(delMem && state.party.length>1){
    var mid=delMem.getAttribute('data-del-member');
    state.party=state.party.filter(function(x){return x.id!==mid;});
    saveState();render();return;
  }

  var delDay=t.closest('[data-del-day]');
  if(delDay && state.days.length>1){
    var did=delDay.getAttribute('data-del-day');
    state.days=state.days.filter(function(x){return x.id!==did;});
    if(ui.planDay>=state.days.length) ui.planDay=state.days.length-1;
    saveState();render();return;
  }

  var locChip=t.closest('[data-loc]');
  if(locChip){ui.loc=locChip.getAttribute('data-loc');render();return;}

  var typeChip=t.closest('[data-type]');
  if(typeChip){ui.type=typeChip.getAttribute('data-type');render();return;}

  var editRestBtn=t.closest('[data-edit-rest]');
  if(editRestBtn){
    e.stopPropagation();
    var erid=editRestBtn.getAttribute('data-edit-rest');
    ui.editingRest=(ui.editingRest===erid?null:erid);
    render();return;
  }

  var resetPriceBtn=t.closest('[data-reset-price]');
  if(resetPriceBtn){
    e.stopPropagation();
    var rprid=resetPriceBtn.getAttribute('data-reset-price');
    if(state.priceOverrides) delete state.priceOverrides[rprid];
    saveState();render();return;
  }

  var clearSlotBtn=t.closest('[data-clear-slot]');
  if(clearSlotBtn){
    e.stopPropagation();
    var parts=clearSlotBtn.getAttribute('data-clear-slot').split(':');
    var dayObj=state.days.find(function(x){return x.id===parts[0];});
    if(dayObj && dayObj.meals) dayObj.meals[parts[1]]=null;
    saveState();render();return;
  }

  var dropSlot=t.closest('[data-drop-slot]');
  if(dropSlot && ui.pickedRest){
    var sParts=dropSlot.getAttribute('data-drop-slot').split(':');
    var dObj=state.days.find(function(x){return x.id===sParts[0];});
    if(dObj){
      dObj.meals=dObj.meals||{};
      dObj.meals[sParts[1]]=ui.pickedRest;
      ui.pickedRest=null;
      saveState();render();return;
    }
  }

  var pickCard=t.closest('[data-pick-rest]');
  if(pickCard && !t.closest('button') && !t.closest('input')){
    var prid=pickCard.getAttribute('data-pick-rest');
    ui.pickedRest=(ui.pickedRest===prid?null:prid);
    render();return;
  }

  var moveBtn=t.closest('[data-move-ride]');
  if(moveBtn){
    var mParts=moveBtn.getAttribute('data-move-ride').split(':');
    var mp=mParts[0],mId=mParts[1],delta=+mParts[2];
    var list=parkRides(mp).map(function(x){return x.id;});
    var pos=list.indexOf(mId);
    var nPos=pos+delta;
    if(pos>-1 && nPos>=0 && nPos<list.length){
      var tmp=list[pos];list[pos]=list[nPos];list[nPos]=tmp;
      state.rideOrder[mp]=list;
      saveState();render();
    }
    return;
  }

  var addRideBtn=t.closest('[data-add-ride]');
  if(addRideBtn){
    var rPark=addRideBtn.getAttribute('data-add-ride');
    var inp=q('[data-new-ride-name="'+CSS.escape(rPark)+'"]');
    var thSel=q('[data-new-ride-thrill="'+CSS.escape(rPark)+'"]');
    var rName=(inp&&inp.value||'').trim();
    if(!rName) return;
    var rTh=+(thSel&&thSel.value)||2;
    var newId=slug(rPark+' '+rName)+'-'+uid().slice(0,3);
    state.customRides=state.customRides||{};
    state.customRides[rPark]=state.customRides[rPark]||[];
    state.customRides[rPark].push({id:newId,name:rName,thrill:rTh});
    var ord=parkRides(rPark).map(function(x){return x.id;});
    state.rideOrder[rPark]=ord;
    state.ridePlans[rPark]=state.ridePlans[rPark]||{};
    state.ridePlans[rPark][newId]='standby';
    saveState();render();return;
  }

  var llParkBtn=t.closest('[data-ll-park]');
  if(llParkBtn){
    ui.llPark=llParkBtn.getAttribute('data-ll-park');
    render();return;
  }

  var planDayBtn=t.closest('[data-plan-day]');
  if(planDayBtn){
    ui.planDay=+planDayBtn.getAttribute('data-plan-day')||0;
    render();return;
  }

  var delEntryBtn=t.closest('[data-del-entry]');
  if(delEntryBtn){
    var eid=delEntryBtn.getAttribute('data-del-entry');
    var curDay=state.days[Math.max(0,Math.min(state.days.length-1,ui.planDay||0))];
    if(curDay && Array.isArray(curDay.entries)){
      curDay.entries=curDay.entries.filter(function(x){return x.id!==eid;});
      saveState();render();
    }
  }
});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='tripName'){
    state.trip=t.value;
    saveState();return;
  }
  if(t.hasAttribute('data-search-rest')){
    ui.search=t.value;
    render();return;
  }
  if(t.hasAttribute('data-trip-notes')){
    state.notes=t.value;
    saveState();return;
  }
});

document.addEventListener('change',function(e){
  var t=e.target;

  if(t.hasAttribute('data-budget')){
    state.budgets[t.getAttribute('data-budget')]=Math.max(0,+t.value||0);
    saveState();render();return;
  }
  if(t.hasAttribute('data-member-name')){
    var m=state.party.find(function(x){return x.id===t.getAttribute('data-member-name');});
    if(m){m.name=t.value;saveState();render();}
    return;
  }
  if(t.hasAttribute('data-member-age')){
    var ma=state.party.find(function(x){return x.id===t.getAttribute('data-member-age');});
    if(ma){ma.age=Math.max(0,Math.min(99,+t.value||0));saveState();render();}
    return;
  }
  if(t.hasAttribute('data-hotel')){
    state.hotel[t.getAttribute('data-hotel')]=Math.max(0,+t.value||0);
    saveState();render();return;
  }
  if(t.hasAttribute('data-ticket')){
    var tk=t.getAttribute('data-ticket');
    state.tickets[tk]=t.type==='checkbox'?t.checked:Math.max(0,+t.value||0);
    saveState();render();return;
  }
  if(t.hasAttribute('data-day-park')){
    var d=state.days.find(function(x){return x.id===t.getAttribute('data-day-park');});
    if(d){d.park=t.value;d.entries=[];saveState();render();}
    return;
  }
  if(t.hasAttribute('data-day-start')){
    var ds=state.days.find(function(x){return x.id===t.getAttribute('data-day-start');});
    if(ds){ds.start=t.value;saveState();render();}
    return;
  }
  if(t.hasAttribute('data-day-ll')){
    var dl=state.days.find(function(x){return x.id===t.getAttribute('data-day-ll');});
    if(dl){dl.llMulti=t.value==='1';saveState();render();}
    return;
  }
  if(t.hasAttribute('data-ov-adult') || t.hasAttribute('data-ov-kid')){
    var isAd=t.hasAttribute('data-ov-adult');
    var rid=t.getAttribute(isAd?'data-ov-adult':'data-ov-kid');
    var baseR=allRest().find(function(x){return x.id===rid;});
    if(baseR){
      state.priceOverrides=state.priceOverrides||{};
      var cur=state.priceOverrides[rid]||{adult:baseR.adult,kid:baseR.kid};
      if(isAd) cur.adult=Math.max(0,+t.value||0);
      else cur.kid=Math.max(0,+t.value||0);
      state.priceOverrides[rid]=cur;
      saveState();render();
    }
    return;
  }
  if(t.hasAttribute('data-ride-plan')){
    var rp=t.getAttribute('data-ride-plan').split(':');
    state.ridePlans[rp[0]]=state.ridePlans[rp[0]]||{};
    state.ridePlans[rp[0]][rp[1]]=t.value;
    saveState();render();return;
  }
  if(t.hasAttribute('data-ll-check')){
    var cid=t.getAttribute('data-ll-check');
    state.llChecked=state.llChecked||{};
    state.llChecked[cid]=t.checked;
    saveState();return;
  }
  if(t.hasAttribute('data-entry-time')){
    var eid=t.getAttribute('data-entry-time');
    var curDay=state.days[Math.max(0,Math.min(state.days.length-1,ui.planDay||0))];
    if(curDay && Array.isArray(curDay.entries)){
      var ev=curDay.entries.find(function(x){return x.id===eid;});
      if(ev){
        ev.time=t.value;
        curDay.entries.sort(function(a,b){return toMin(a.time)-toMin(b.time);});
        saveState();render();
      }
    }
  }
});

/* drag & drop across dining, rides, and day plan */
document.addEventListener('dragstart',function(e){
  var restCard=e.target.closest('[data-drag-rest]');
  if(restCard){
    dragState={type:'rest',id:restCard.getAttribute('data-drag-rest')};
    restCard.classList.add('dragging');
    return;
  }
  var placedCard=e.target.closest('[data-drag-placed]');
  if(placedCard){
    dragState={type:'placed',id:placedCard.getAttribute('data-drag-placed')};
    return;
  }
  var rideItem=e.target.closest('[data-ride-id]');
  if(rideItem){
    dragState={type:'ride',id:rideItem.getAttribute('data-ride-id'),extra:rideItem.getAttribute('data-ride-park')};
    rideItem.classList.add('dragging');
    return;
  }
  var tlItem=e.target.closest('[data-entry-id]');
  if(tlItem){
    dragState={type:'entry',id:tlItem.getAttribute('data-entry-id')};
  }
});

document.addEventListener('dragover',function(e){
  var dz=e.target.closest('[data-drop-slot],[data-ride-id],[data-ride-end],[data-entry-id],#planTimeline');
  if(dz){
    e.preventDefault();
    dz.classList.add('over');
  }
});

document.addEventListener('dragleave',function(e){
  var dz=e.target.closest('[data-drop-slot],[data-ride-id],[data-ride-end],[data-entry-id],#planTimeline');
  if(dz) dz.classList.remove('over');
});

document.addEventListener('drop',function(e){
  var dz=e.target.closest('[data-drop-slot],[data-ride-id],[data-ride-end],[data-entry-id],#planTimeline');
  if(!dz) return;
  e.preventDefault();
  dz.classList.remove('over');

  if(dz.hasAttribute('data-drop-slot') && (dragState.type==='rest' || dragState.type==='placed')){
    var parts=dz.getAttribute('data-drop-slot').split(':');
    var targetDay=state.days.find(function(x){return x.id===parts[0];});
    if(!targetDay) return;
    targetDay.meals=targetDay.meals||{};
    if(dragState.type==='rest'){
      targetDay.meals[parts[1]]=dragState.id;
    }else if(dragState.type==='placed'){
      var srcParts=dragState.id.split(':');
      var srcDay=state.days.find(function(x){return x.id===srcParts[0];});
      if(srcDay && srcDay.meals){
        var movedId=srcDay.meals[srcParts[1]];
        targetDay.meals[parts[1]]=movedId;
        if(srcDay.id!==targetDay.id || srcParts[1]!==parts[1]) srcDay.meals[srcParts[1]]=null;
      }
    }
    dragState={type:null,id:null};
    saveState();render();return;
  }

  if(dragState.type==='ride' && (dz.hasAttribute('data-ride-id') || dz.hasAttribute('data-ride-end'))){
    var pName=dz.getAttribute('data-ride-park')||dz.getAttribute('data-ride-end');
    if(pName && pName===dragState.extra){
      var list=parkRides(pName).map(function(x){return x.id;});
      var fromIdx=list.indexOf(dragState.id);
      if(fromIdx>-1){
        list.splice(fromIdx,1);
        if(dz.hasAttribute('data-ride-end')){
          list.push(dragState.id);
        }else{
          var toIdx=list.indexOf(dz.getAttribute('data-ride-id'));
          list.splice(Math.max(0,toIdx),0,dragState.id);
        }
        state.rideOrder[pName]=list;
        saveState();render();
      }
    }
    dragState={type:null,id:null};return;
  }

  if(dragState.type==='entry' && (dz.hasAttribute('data-entry-id') || dz.id==='planTimeline')){
    var curDay=state.days[Math.max(0,Math.min(state.days.length-1,ui.planDay||0))];
    if(curDay && Array.isArray(curDay.entries)){
      var fIdx=curDay.entries.findIndex(function(x){return x.id===dragState.id;});
      if(fIdx>-1){
        var item=curDay.entries.splice(fIdx,1)[0];
        if(dz.hasAttribute('data-entry-id')){
          var tIdx=curDay.entries.findIndex(function(x){return x.id===dz.getAttribute('data-entry-id');});
          curDay.entries.splice(Math.max(0,tIdx),0,item);
        }else{
          curDay.entries.push(item);
        }
        saveState();render();
      }
    }
    dragState={type:null,id:null};
  }
});

document.addEventListener('dragend',function(){
  document.querySelectorAll('.dragging,.over').forEach(function(el){
    el.classList.remove('dragging','over');
  });
  dragState={type:null,id:null};
});

window.addEventListener('resize',function(){
  var tb=q('.topbar');
  if(tb) document.documentElement.style.setProperty('--tb',tb.offsetHeight+'px');
});

render();
})();
</script>
