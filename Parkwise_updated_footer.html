<title>Parkwise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a sticky budget bar over four working tabs (budget, dining, ride ranking, day plan); drag cards onto slots, or tap to pick then tap to place. */
:root{
  --bg:#F1F4FA; --surface:#FFFFFF; --surface2:#E8EDF7; --line:#D3DBEA;
  --ink:#15213F; --muted:#56637F;
  --brand:#2447A8; --on-brand:#FFFFFF;
  --accent:#A85A06; --accent-soft:#FCE9D2;
  --good:#13774B; --good-soft:#D9F1E5;
  --bad:#B8322A; --bad-soft:#FADFDC;
  --drop:#DCE6FF;
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1630; --surface:#172246; --surface2:#1F2D59; --line:#2D3C6C;
    --ink:#E9EEFB; --muted:#A3AFCF;
    --brand:#8DA8FF; --on-brand:#0E1630;
    --accent:#F2A650; --accent-soft:#3B2C16;
    --good:#4CC38A; --good-soft:#163A2C;
    --bad:#FF8577; --bad-soft:#44201D;
    --drop:#243C7C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#172246; --surface2:#1F2D59; --line:#2D3C6C;
  --ink:#E9EEFB; --muted:#A3AFCF;
  --brand:#8DA8FF; --on-brand:#0E1630;
  --accent:#F2A650; --accent-soft:#3B2C16;
  --good:#4CC38A; --good-soft:#163A2C;
  --bad:#FF8577; --bad-soft:#44201D;
  --drop:#243C7C; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;max-width:100%}
input[type=number]{width:92px;font-variant-numeric:tabular-nums}
input[type=time]{width:112px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted,.hint{color:var(--muted)}
.hint{font-size:.85rem}
.wrap{max-width:1180px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top-row{max-width:1180px;margin:0 auto;display:flex;gap:16px 28px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:10px}
.brand{display:flex;gap:10px;align-items:center;color:var(--brand);min-width:0}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:1.25rem;color:var(--ink);display:block;line-height:1}
.tripname{border:0;background:transparent;padding:2px 0;color:var(--muted);font-size:.88rem;width:min(260px,60vw);border-radius:4px}
.tripname:hover{background:var(--surface2)}
.sum{display:flex;gap:6px 22px;align-items:center;flex-wrap:wrap;min-width:0}
.sum-main{display:flex;flex-direction:column}
.sum-main .k{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sum-main strong{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.sum-bar{width:220px;max-width:100%}
.sum-bar .st{font-size:.82rem;margin-top:4px;display:block}
.sum-split{display:flex;gap:14px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.sum-split b{color:var(--ink);font-weight:600}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}
.tab:hover{color:var(--ink)}

main{max-width:1180px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card + .card{margin-top:16px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:16px;align-items:start}
.grid2 > .card{margin-top:0}
.split{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}

.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled,.x:disabled{opacity:.4;cursor:not-allowed}
.x{background:none;border:0;color:var(--muted);font-size:1.15rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface2);color:var(--ink)}
.link{background:none;border:0;color:var(--brand);padding:0;font-size:.85rem;text-decoration:underline}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.t-ts,.pill.t-char{background:var(--accent-soft);color:var(--accent)}
.pill.t-qs{background:var(--surface2)}
.pill.t-snack{background:var(--good-soft);color:var(--good)}
.pill.b-free{background:var(--good-soft);color:var(--good)}
.pill.b-child{background:var(--accent-soft);color:var(--accent)}
.pill.b-adult{background:var(--surface2);color:var(--ink)}
.pill.th-3{background:var(--bad-soft);color:var(--bad)}
.pill.th-2{background:var(--accent-soft);color:var(--accent)}
.pill.th-1{background:var(--good-soft);color:var(--good)}
.money-in{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.over > i{background:var(--bad)}
.good{color:var(--good)} .bad{color:var(--bad)}
.status{font-weight:600;font-size:.88rem}

/* budget rows */
.brow{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.brow:first-of-type{border-top:0;padding-top:0}
.brow-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.brow-n{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.tgt{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-size:.88rem}

/* forms */
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
.prow input[type=text]{flex:1 1 120px}
.age{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:.88rem}
.age input{width:64px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fld{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.fld small{font-size:.78rem}
.fld input[type=number]{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-top:12px}
.drow{display:grid;grid-template-columns:auto repeat(auto-fit,minmax(130px,1fr)) auto;gap:10px 14px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.drow:first-of-type{border-top:0}
.drow .dn{font-family:var(--f-display);font-weight:700;padding-bottom:7px;min-width:48px}
.drow select{width:100%}
.drow input[type=number]{width:100%}
.drow label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:560px}
th,td{text-align:right;padding:8px 10px;border-top:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0;font-weight:600}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tfoot td{font-weight:700;border-top:2px solid var(--line)}

/* dining */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--surface2);border:0;border-radius:99px;padding:5px 11px;font-size:.84rem;font-weight:500}
.chip.on{background:var(--brand);color:var(--on-brand)}
.catalog{display:grid;gap:8px;max-height:calc(100vh - var(--tb,150px) - 150px);overflow:auto;padding:2px 4px 2px 2px;min-height:120px}
@media (max-width:820px){.catalog{max-height:55vh}}
.sticky{position:sticky;top:calc(var(--tb,150px) + env(safe-area-inset-top,0px) + 14px)}
@media (max-width:820px){.sticky{position:static}}
.rcard{background:var(--surface2);border-radius:10px;padding:10px 12px;cursor:grab;display:grid;gap:4px;border:2px solid transparent}
.rcard.picked{border-color:var(--brand);background:var(--drop)}
.rcard.dragging{opacity:.5}
.rc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rc-top strong{font-weight:600}
.rc-meta{font-size:.84rem;color:var(--muted)}
.rc-meta b{color:var(--ink)}
.rc-note{font-size:.8rem;color:var(--muted)}
.pill.t-show{background:var(--accent-soft);color:var(--accent)}
.pill.est{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.pill.chk{background:var(--bad-soft);color:var(--bad)}
.add-rest{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.add-rest summary{cursor:pointer;font-weight:600;color:var(--brand)}
.add-rest .fgrid{margin-top:10px}
.add-rest input[type=text],.add-rest select{width:100%}
.edit{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.banner{background:var(--drop);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.dcard + .dcard{margin-top:14px}
.dc-h{display:flex;justify-content:space-between;gap:8px 16px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.dc-h .place{color:var(--muted);font-weight:500;margin-left:8px;font-family:var(--f-body);font-size:.9rem}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.slot{border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:110px;display:grid;align-content:start;gap:6px}
.slot.armed{border-color:var(--brand);cursor:pointer}
.slot.over{background:var(--drop);border-color:var(--brand)}
.slot-h{display:flex;justify-content:space-between;align-items:center;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slot .empty{color:var(--muted);font-size:.85rem}
.placed{background:var(--surface2);border-radius:8px;padding:9px 10px;cursor:grab;display:grid;gap:3px}
.placed strong{font-weight:600}
.placed .tot{font-family:var(--f-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.placed .pp{font-size:.8rem;color:var(--muted);display:grid;gap:1px}

/* rides + plan */
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.ri{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:9px 10px;cursor:grab;flex-wrap:wrap;border:2px solid transparent}
.ri.over{border-color:var(--brand);background:var(--drop)}
.ri.dragging{opacity:.5}
.ri .rno{font-family:var(--f-display);font-weight:700;width:26px;text-align:center;color:var(--brand);font-size:1.1rem}
.ri-main{flex:1 1 160px;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ri-main strong{font-weight:600}
.ri-ctl{display:flex;gap:2px}
.ri select{padding:5px 7px;font-size:.85rem}
.endzone{border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px}
.endzone.over{background:var(--drop);border-color:var(--brand)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.addrow input[type=text]{flex:1 1 160px}
.dtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.dtab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 14px;text-align:left;white-space:nowrap;font-weight:600;display:grid}
.dtab small{font-weight:400;color:var(--muted);font-size:.78rem}
.dtab.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.dtab.on small{color:var(--on-brand);opacity:.85}
.timeline{list-style:none;margin:0;padding:10px;display:grid;gap:8px;border:2px dashed var(--line);border-radius:12px;min-height:160px;align-content:start}
.timeline.over{background:var(--drop);border-color:var(--brand)}
.tl{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.tl-body{flex:1 1 140px;min-width:0;display:grid}
.tl-body strong{font-weight:600}
.tl-body span{font-size:.82rem;color:var(--muted)}
.badge{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted);min-width:58px;text-align:center}
.badge.ride{background:var(--brand);color:var(--on-brand)}
.badge.meal{background:var(--accent-soft);color:var(--accent)}
.badge.show{background:var(--good-soft);color:var(--good)}
.note{background:var(--accent-soft);color:var(--accent);padding:8px 12px;border-radius:8px;font-size:.88rem;margin-bottom:12px}
.tag{font-size:.72rem;background:var(--good-soft);color:var(--good);padding:2px 7px;border-radius:99px;font-weight:600}
.foot{max-width:1180px;margin:32px auto 0;color:var(--muted);font-size:.82rem;display:grid;gap:10px}
.foot-btns{display:flex;gap:8px;flex-wrap:wrap}
h1{font-size:1.8rem;font-weight:700;margin:0 0 4px}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.intro ol{margin:8px 0 14px;padding-left:20px;display:grid;gap:4px}
.sum-tools{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.sum-tools p{flex:1 1 260px}
.sheet{display:grid;gap:24px}
.sheet h2{font-size:1.15rem;margin-bottom:8px}
.sheet table{min-width:0}
.sheet ol{margin:4px 0 0;padding-left:22px;display:grid;gap:2px}
.btable th:nth-child(2),.btable td:nth-child(2){text-align:right}
.etable th,.etable td{text-align:left;vertical-align:top}
.etable td:first-child{white-space:nowrap;width:1%}
.sday .costs{margin-bottom:8px}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface2:#f1f1f1;--line:#bdbdbd;--ink:#000;--muted:#444;--brand:#000;--on-brand:#fff;--accent:#000;--accent-soft:#eee;--good:#000;--good-soft:#eee;--bad:#000;--bad-soft:#eee;--drop:#eee}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  body::before{display:none}
  .topbar,.foot,.no-print{display:none!important}
  main{max-width:none}
  .card{border:0;padding:0;border-radius:0}
  .sday{break-inside:avoid}
  @page{margin:14mm}
}
@media (prefers-reduced-motion:no-preference){.bar > i{transition:width .3s ease}}
</style>

<header class="topbar" id="top">
  <div class="top-row">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg>
      <div><span class="wordmark">Parkwise</span><input id="tripName" class="tripname" data-f="trip" aria-label="Trip name" maxlength="60"></div>
    </div>
    <div class="sum" id="sum"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Planner sections"></nav>
</header>
<main id="view"></main>
<footer class="foot" id="foot"></footer>

<script>
(function(){
'use strict';
var KEY='parkwise-v1';
var MEALS=['breakfast','lunch','dinner','snack'];
var MEAL_LABEL={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',snack:'Snack'};
var MEAL_TIME={breakfast:'08:30',lunch:'12:30',dinner:'18:30',snack:'15:30'};
var PARKS=['Magic Kingdom','EPCOT','Hollywood Studios','Animal Kingdom'];
var PLACES=PARKS.concat(['Disney Springs','Resort day']);
var LOCS=PARKS.concat(['Disney Springs','Resorts','Snacks']);
var TYPE_LABEL={qs:'Quick service',ts:'Table service',char:'Character meal',show:'Dinner show',snack:'Snack'};
var BAND_LABEL={free:'Under 3',child:'Child 3–9',adult:'Adult 10+'};
var THRILL={1:'Gentle',2:'Moderate',3:'Intense'};
var PLAN_LABEL={standby:'Standby',multi:'Multi Pass',single:'Single Pass'};
var DEF_MULTI={'Magic Kingdom':32,'EPCOT':27,'Hollywood Studios':30,'Animal Kingdom':22};
var TABS=[['trip','Trip & budget'],['dining','Dining'],['rides','Ride priorities'],['plan','Day plan'],['summary','Summary']];
var ENTRY_LABEL={ride:'Ride',show:'Show',break:'Break',travel:'Travel',note:'Note',meal:'Meal'};

function q(s){return document.querySelector(s);}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
function uid(){return Math.random().toString(36).slice(2,8);}
function pl(n,w){return n+' '+w+(n===1?'':'s');}
function toMin(s){var p=String(s||'09:00').split(':');return (+p[0]||0)*60+(+p[1]||0);}
function fromMin(m){m=Math.max(0,Math.min(23*60+59,m));var h=Math.floor(m/60),mm=m%60;return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;}
function fmtTime(s){var m=toMin(s),h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+(mm<10?'0':'')+mm+' '+ap;}

/* ---------- catalog (starting estimates; every price is editable) ---------- */
var R=[];
function addR(loc,rows){rows.forEach(function(r){var o=r[4]||{};R.push({id:slug(loc+' '+r[0]),name:r[0],loc:loc,type:r[1],adult:r[2],kid:r[3],e:!!o.e,c:!!o.c,inc:!!o.inc,n:o.n||''});});}
var E={e:1},EC={e:1,c:1};
addR('Magic Kingdom',[
 ["Cinderella's Royal Table",'char',92,57,{n:'Lunch and dinner price. Breakfast is $79 adult, $49 child.'}],
 ['The Crystal Palace','char',64,46,{n:'Lunch and dinner price. Breakfast is $57 adult, $37 child.'}],
 ['Be Our Guest','ts',49,19,{e:1,n:'Dinner entrees run $35–55. Child price estimated.'}],
 ['Liberty Tree Tavern','ts',45,18,{e:1,n:'Family-style meal. Verify the price.'}],
 ["Tony's Town Square",'ts',38,14,E],
 ['The Plaza Restaurant','ts',28,12,E],
 ['Jungle Navigation Co. Skipper Canteen','ts',39,14,{e:1,n:'Based on a $35 noodle bowl plus a drink. Child price estimated.'}],
 ['The Diamond Horseshoe','ts',32,14,EC],
 ['Pecos Bill Tall Tale Inn','qs',17,9,E],['Columbia Harbour House','qs',16,9,E],["Cosmic Ray's Starlight Cafe",'qs',16,9,E],["Casey's Corner",'qs',14,8,E]]);
addR('EPCOT',[
 ['Akershus Royal Banquet Hall','char',69,47,{n:'Princess meal, lunch and dinner price. Breakfast is $66 adult, $42 child.'}],
 ["Chip 'n' Dale's Harvest Feast (Garden Grill)",'char',62,43,{n:'Lunch and dinner price. Breakfast is $49 adult, $34 child.'}],
 ['Biergarten Restaurant','ts',51,28,{n:'Buffet, posted price.'}],

/* ---------- money logic ---------- */
function band(a){a=+a||0;return a<3?'free':a<10?'child':'adult';}
function counts(){var c={adult:0,child:0,free:0};state.party.forEach(function(p){c[band(p.age)]++;});return c;}
function restOf(id){if(!id)return null;var b=allRest().filter(function(r){return r.id===id;})[0];if(!b)return null;var o=state.prices[id];return o?Object.assign({},b,{adult:o.adult,kid:o.kid,e:false}):b;}
function isTS(r){return r.type==='ts'||r.type==='char'||r.type==='show';}
function meal(r){var c=counts();var sub=c.adult*r.adult+c.child*r.kid+c.free*state.toddler;var tax=r.inc?0:sub*state.taxRate/100;var tip=(isTS(r)&&!r.inc)?sub*state.tipRate/100:0;return {sub:sub,tax:tax,tip:tip,total:sub+tax+tip,c:c};}
function totals(){
  var c=counts(),ticketed=c.adult+c.child;
  var parkDays=state.days.filter(function(d){return PARKS.indexOf(d.place)>-1;}).length;
  var perDayTix=c.adult*state.tix.adult+c.child*state.tix.child;
  var hopper=state.tix.hopper?ticketed*state.tix.hopperPrice:0;
  var tickets=parkDays*perDayTix+hopper,ll=0,dining=0;
  var byDay=state.days.map(function(d){
    var isPark=PARKS.indexOf(d.place)>-1,l=0,din=0;
    if(isPark){if(d.ll==='multi')l=d.multiPrice*ticketed;else if(d.ll==='single')l=d.singleCount*d.singlePrice*ticketed;}
    MEALS.forEach(function(m){var r=restOf(d.meals[m]);if(r)din+=meal(r).total;});
    ll+=l;dining+=din;
    return {day:d,tix:isPark?perDayTix:0,ll:l,dining:din};
  });
  return {tickets:tickets,ll:ll,dining:dining,total:tickets+ll+dining,byDay:byDay,perDayTix:perDayTix,parkDays:parkDays,ticketed:ticketed,hopper:hopper};
}
function dayById(id){return state.days.filter(function(d){return d.id===id;})[0];}
function placeLoc(p){return p==='Resort day'?'Resorts':p;}

function summary(){

  q('#sum').innerHTML='<div class="sum-main"><span class="k">Estimated total</span><strong>'+money(t.total)+'</strong></div>'+

}

function pill(type){return '<span class="pill t-'+type+'">'+TYPE_LABEL[type]+'</span>';}
function flags(r){return (r.e?'<span class="pill est" title="Rough estimate. Tap Edit prices to enter your own.">Estimate</span>':'')+(r.c?'<span class="pill chk" title="Sources disagree on whether this is open">Check if open</span>':'');}
function kindOk(r){return ui.kind==='all'||(ui.kind==='sit'?(r.type==='ts'||r.type==='char'||r.type==='show'):ui.kind==='qs'?(r.type==='qs'||r.type==='snack'):true);}
function catalogItems(){

function mealBreakdown(r,m){

function viewRides(){

    '<div class="addrow"><input type="text" id="customRide" placeholder="Add your own (a show, a meet and greet)" maxlength="60" aria-label="Add your own attraction"><button class="btn sm" data-act="rank-custom">Add</button></div></section></div>';

function scheduledDays(rideId){var out=[];state.days.forEach(function(d,i){if((state.plan[d.id]||[]).some(function(e){return e.rideId===rideId;}))out.push(i+1);});return out;}
function rankOf(day,rideId){return (state.ranks[day.place]||[]).filter(function(r){return r.id===rideId;})[0];}
function viewPlan(){
  if(ui.planDay>=state.days.length)ui.planDay=state.days.length-1;
  var day=state.days[ui.planDay],t=totals().byDay[ui.planDay],isPark=PARKS.indexOf(day.place)>-1;
  var tabs=state.days.map(function(d,i){return '<button class="dtab'+(i===ui.planDay?' on':'')+'" data-act="day-tab" data-i="'+i+'">Day '+(i+1)+'<small>'+esc(d.place)+'</small></button>';}).join('');
  var ranked=state.ranks[day.place]||[];
  var left=!isPark?'<p class="hint">'+esc(day.place)+' has no ride list. Use the form below to add stops, then set meals in Dining.</p>':
    (ranked.length?'<ul class="list" style="padding:0">'+ranked.map(function(r,i){
      var sd=scheduledDays(r.id);
      return '<li class="ri" draggable="true" data-drag="rankadd:'+day.place+':'+r.id+'"><span class="rno">'+(i+1)+'</span><div class="ri-main"><strong>'+esc(r.name)+'</strong><span class="pill">'+PLAN_LABEL[r.plan]+'</span>'+(sd.length?'<span class="tag">Day '+sd.join(', ')+'</span>':'')+'</div><button class="btn ghost sm" data-act="plan-add" data-park="'+day.place+'" data-id="'+r.id+'">Add</button></li>';
    }).join('')+'</ul>':'<p class="hint">No ranked rides for '+esc(day.place)+' yet. Rank some in Ride priorities.</p>');
  var plan=(state.plan[day.id]||[]).map(function(e){return {kind:'plan',e:e,time:e.time};});
  MEALS.forEach(function(m){if(day.meals[m])plan.push({kind:'meal',m:m,time:day.mealTimes[m]});});
  plan.sort(function(a,b){return toMin(a.time)-toMin(b.time);});
  var needsLL=false,singles=0;
  var tl=plan.map(function(x){
    if(x.kind==='meal'){var r=restOf(day.meals[x.m]),mm=meal(r);
      return '<li class="tl"><input type="time" value="'+x.time+'" data-f="meal-time" data-day="'+day.id+'" data-m="'+x.m+'" aria-label="Time"><span class="badge meal">Meal</span><div class="tl-body"><strong>'+esc(r.name)+'</strong><span>'+MEAL_LABEL[x.m]+' · '+money(mm.total)+' for your party</span></div><button class="x" data-act="rm-meal" data-d="'+day.id+'" data-m="'+x.m+'" aria-label="Remove meal">×</button></li>';}
    var e=x.e,rk=e.rideId?rankOf(day,e.rideId):null,sub='';
    if(e.type==='ride'){var p=rk?rk.plan:'standby';sub=PLAN_LABEL[p];if(p!=='standby')needsLL=true;if(p==='single')singles++;}
    return '<li class="tl"><input type="time" value="'+e.time+'" data-f="plan-time" data-day="'+day.id+'" data-e="'+e.id+'" aria-label="Time"><span class="badge '+e.type+'">'+({ride:'Ride',show:'Show',break:'Break',travel:'Travel',note:'Note'}[e.type]||'Note')+'</span><div class="tl-body"><strong>'+esc(e.label)+'</strong>'+(sub?'<span>'+sub+'</span>':'')+'</div><button class="x" data-act="rm-entry" data-day="'+day.id+'" data-e="'+e.id+'" aria-label="Remove">×</button></li>';
  }).join('');
  var warn='';
  if(isPark&&needsLL&&day.ll==='none')warn='<div class="note">Some rides here are set to Multi Pass or Single Pass, but this day has no Lightning Lane in your budget. Change it in Trip &amp; budget.</div>';
  else if(isPark&&day.ll==='single'&&singles>day.singleCount)warn='<div class="note">You marked '+singles+' Single Pass rides but budgeted for '+day.singleCount+'. Raise the count in Trip &amp; budget.</div>';
  return '<div class="dtabs">'+tabs+'</div>'+
    '<div class="split"><section class="card"><div class="sec-h"><h3>Ranked rides'+(isPark?' · '+esc(day.place):'')+'</h3></div><p class="hint" style="margin-bottom:10px">Drag onto the timeline, or press Add.</p>'+left+'</section>'+
    '<section class="card"><div class="sec-h"><h2>Day '+(ui.planDay+1)+' · '+esc(day.place)+'</h2><span class="hint">Lightning Lane '+money(t.ll)+' · Dining '+money(t.dining)+'</span></div>'+warn+
    '<ol class="timeline" data-drop="timeline:'+day.id+'">'+(tl||'<li class="hint" style="padding:18px;text-align:center">Your day is empty. Drag a ride here or add a stop below.</li>')+'</ol>'+
    '<div class="addrow"><select id="cType" aria-label="Type"><option value="show">Show</option><option value="break">Break</option><option value="travel">Travel</option><option value="note">Note</option></select><input type="text" id="cLabel" placeholder="Fireworks, pool break, monorail to EPCOT" maxlength="70" aria-label="Stop name"><input type="time" id="cTime" value="'+nextTime(day)+'" aria-label="Time"><button class="btn sm" data-act="add-custom">Add stop</button></div></section></div>';
}
function nextTime(day){var ts=(state.plan[day.id]||[]).map(function(e){return toMin(e.time);});if(!ts.length)return '09:00';return fromMin(Math.min(22*60+30,Math.max.apply(null,ts)+45));}

function pristine(){
  var s=state,p=s.party;
  if(p.length!==1||p[0].name!=='Traveler 1'||p[0].age!==35)return false;
  if(s.days.length!==1)return false;
  var d=s.days[0];
  if(d.place!=='Magic Kingdom'||d.ll!=='none')return false;
  if(MEALS.some(function(m){return d.meals[m];}))return false;
  if(s.budget.tickets||s.budget.ll||s.budget.dining)return false;
  if(Object.keys(s.prices).length)return false;
  if(Object.keys(s.ranks).some(function(k){return s.ranks[k].length;}))return false;
  if(Object.keys(s.plan).some(function(k){return s.plan[k].length;}))return false;
  return s.tix.adult===155&&s.tix.child===150&&!s.tix.hopper;
}
function introHtml(){
  return '<section class="card intro no-print"><h2>Plan your Disney World trip</h2><ol><li>Add who is going and their ages below.</li><li>Choose how many days you have and where you will be each day.</li><li>Drag restaurants onto meals in Dining, rank rides, then plan each day.</li></ol><div class="prow"><button class="btn ghost sm" data-act="sample-now">See a sample trip</button><span class="hint">Replaces this blank plan with an example you can edit.</span></div></section>';
}
function targetTotal(){return state.budget.tickets+state.budget.ll+state.budget.dining;}
function dayEntries(day){

  (state.plan[day.id]||[]).forEach(function(e){var rk=e.rideId?rankOf(day,e.rideId):null;out.push({time:e.time,type:e.type,label:e.label,sub:e.type==='ride'?PLAN_LABEL[rk?rk.plan:'standby']:''});});
  MEALS.forEach(function(m){var r=restOf(day.meals[m]);if(r)out.push({time:day.mealTimes[m],type:'meal',label:MEAL_LABEL[m]+': '+r.name,sub:money(meal(r).total)+' for the party'});});
  out.sort(function(a,b){return toMin(a.time)-toMin(b.time);});
  return out;
}
function summaryText(){
  var t=totals(),L=[],tg=targetTotal();

  state.party.forEach(function(p){L.push('- '+p.name+', age '+p.age+' ('+BAND_LABEL[band(p.age)]+')');});
  L.push('');L.push('BUDGET (estimate / budget)');
  [['Tickets','tickets'],['Lightning Lane','ll'],['Dining','dining']].forEach(function(x){L.push('- '+x[0]+': '+money(t[x[1]])+(state.budget[x[1]]?' / '+money(state.budget[x[1]]):''));});
  L.push('- Total: '+money(t.total)+(tg?' / '+money(tg):''));
  state.days.forEach(function(d,i){
    var b=t.byDay[i],en=dayEntries(d);
    L.push('');L.push('DAY '+(i+1)+' - '+d.place+' ('+money(b.tix+b.ll+b.dining)+')');

  });

  if(any.length){L.push('');L.push('RIDE PRIORITIES');any.forEach(function(p){L.push(p);state.ranks[p].forEach(function(r,i){L.push('  '+(i+1)+'. '+r.name+' ('+PLAN_LABEL[r.plan]+')');});});}
  return L.join('\n');
}

    return '<section class="sday"><h2>Day '+(i+1)+' · '+esc(d.place)+'</h2><p class="muted costs">'+(isPark?'Tickets '+money(b.tix)+' · Lightning Lane '+money(b.ll)+(llTxt?' ('+llTxt+')':'')+' · ':'')+'Dining '+money(b.dining)+' · <strong>Day total '+money(b.tix+b.ll+b.dining)+'</strong></p>'+body+'</section>';
  }).join('');
  var rk=PARKS.filter(function(p){return (state.ranks[p]||[]).length;}).map(function(p){
    return '<div class="sday"><h3>'+p+'</h3><ol>'+state.ranks[p].map(function(r){return '<li>'+esc(r.name)+' <span class="muted">('+PLAN_LABEL[r.plan]+')</span></li>';}).join('')+'</ol></div>';
  }).join('');
  return tools+'<article class="card sheet"><header><h1>'+esc(state.tripName)+'</h1><p class="muted">Walt Disney World trip summary · '+pl(state.days.length,'day')+' · '+pl(state.party.length,'traveler')+'</p></header>'+
    '<section class="sday"><h2>Travelers</h2><p>'+state.party.map(function(p){return esc(p.name)+' ('+p.age+', '+BAND_LABEL[band(p.age)].toLowerCase()+')';}).join(', ')+'</p></section>'+
    '<section class="sday"><h2>Budget</h2><div class="scroll"><table class="btable"><thead><tr><th>Category</th><th>Estimate</th><th>Budget</th><th>Left</th></tr></thead><tbody>'+brows+'</tbody><tfoot><tr><td>Total</td><td>'+money(t.total)+'</td><td>'+(tg>0?money(tg):'')+'</td><td>'+tleft+'</td></tr></tfoot></table></div>'+(state.tix.hopper?'<p class="hint">Tickets include Park Hopper ('+money(t.hopper)+').</p>':'')+'</section>'+
    days+(rk?'<section><h2>Ride priorities</h2>'+rk+'</section>':'')+
    '<p class="hint">Prices are estimates including '+state.taxRate+'% tax and '+state.tipRate+'% tip on table service. Confirm current prices before you go.</p></article>';
}
var VIEWS={trip:viewTrip,dining:viewDining,rides:viewRides,plan:viewPlan,summary:viewSummary};
function setTb(){q('#top');document.documentElement.style.setProperty('--tb',q('#top').offsetHeight+'px');}
function render(){
  var tn=q('#tripName');if(document.activeElement!==tn)tn.value=state.tripName;
  summary();tabsHtml();footHtml();
  q('#view').innerHTML=VIEWS[ui.tab]();
  setTb();
}

/* ---------- actions ---------- */
var rq=0;
function later(){save();clearTimeout(rq);rq=setTimeout(function(){var k=activeKey();render();restoreFocus(k);},0);}
var FK=['f','i','d','id','k','m','e','park','day'];
function keyOf(n){return FK.map(function(a){return n.dataset[a]||'';}).join('|');}
function activeKey(){var a=document.activeElement;return a&&a.dataset&&a.dataset.f?keyOf(a):null;}
function restoreFocus(k){if(!k)return;var all=document.querySelectorAll('[data-f]');for(var i=0;i<all.length;i++){if(keyOf(all[i])===k){all[i].focus();try{if(all[i].tagName==='INPUT'&&/number|text/.test(all[i].type))all[i].select();}catch(e){}return;}}}
function num(v,min){return Math.max(min||0,parseFloat(v)||0);}
function moveItem(arr,from,to){var it=arr.splice(from,1)[0];arr.splice(to,0,it);}

function field(t){
  var f=t.dataset.f,v=t.value,d;
  switch(f){
    case 'trip':state.tripName=v.trim()||'My Disney Trip';break;
    case 'party-name':state.party[+t.dataset.i].name=v.trim()||'Traveler';break;
    case 'party-age':state.party[+t.dataset.i].age=Math.min(99,Math.floor(num(v)));break;
    case 'tix-adult':state.tix.adult=num(v);break;
    case 'tix-child':state.tix.child=num(v);break;
    case 'tix-hopper':state.tix.hopper=t.checked;break;
    case 'tix-hopperPrice':state.tix.hopperPrice=num(v);break;
    case 'taxRate':state.taxRate=Math.min(20,num(v));break;
    case 'tipRate':state.tipRate=Math.min(40,num(v));break;
    case 'toddler':state.toddler=num(v);break;
    case 'budget':state.budget[t.dataset.k]=num(v);break;
    case 'day-place':d=dayById(t.dataset.d);d.place=v;if(DEF_MULTI[v])d.multiPrice=DEF_MULTI[v];if(PARKS.indexOf(v)<0)d.ll='none';break;
    case 'day-ll':dayById(t.dataset.d).ll=v;break;
    case 'day-multi':dayById(t.dataset.d).multiPrice=num(v);break;
    case 'day-singleCount':dayById(t.dataset.d).singleCount=Math.floor(num(v));break;
    case 'day-singlePrice':dayById(t.dataset.d).singlePrice=num(v);break;
    case 'rest-adult':case 'rest-kid':{
      var id=t.dataset.id,b=allRest().filter(function(r){return r.id===id;})[0];
      var o=state.prices[id]||(state.prices[id]={adult:b.adult,kid:b.kid});
      if(f==='rest-adult')o.adult=num(v);else o.kid=num(v);break;}
    case 'rank-plan':state.ranks[t.dataset.park][+t.dataset.i].plan=v;break;
    case 'plan-time':{var e=(state.plan[t.dataset.day]||[]).filter(function(x){return x.id===t.dataset.e;})[0];if(e&&v)e.time=v;break;}
    case 'meal-time':if(v)dayById(t.dataset.day).mealTimes[t.dataset.m]=v;break;
  }
  later();
}

function addRank(park,ride,at){
  var arr=state.ranks[park]||(state.ranks[park]=[]);
  if(arr.some(function(x){return x.id===ride.id;}))return;
  var item={id:ride.id,name:ride.name,plan:'standby',thrill:ride.thrill||0};
  if(at==null||at>arr.length)arr.push(item);else arr.splice(at,0,item);
}
function addToDay(day,item){var list=state.plan[day.id]||(state.plan[day.id]=[]);list.push({id:uid(),time:nextTime(day),type:'ride',label:item.name,rideId:item.id});}
function placeMeal(dayId,m,id){var d=dayById(dayId);if(d&&restOf(id)){d.meals[m]=id;}}

function act(name,t){
  var d,i;
  switch(name){
    case 'tab':location.hash=t.dataset.id;return;
    case 'add-person':state.party.push({id:uid(),name:'Traveler '+(state.party.length+1),age:10});break;
    case 'rm-person':if(state.party.length>1)state.party.splice(+t.dataset.i,1);break;
    case 'add-day':{var last=state.days[state.days.length-1];state.days.push(mkDay(last?last.place:'Magic Kingdom','none'));break;}
    case 'rm-day':if(state.days.length>1){d=dayById(t.dataset.d);delete state.plan[d.id];state.days=state.days.filter(function(x){return x.id!==d.id;});}break;
    case 'pick':ui.picked=ui.picked===t.dataset.id?null:t.dataset.id;break;
    case 'cancel-pick':ui.picked=null;break;
    case 'place':if(ui.picked){placeMeal(t.dataset.d,t.dataset.m,ui.picked);ui.picked=null;}else return;break;
    case 'clear-meal':dayById(t.dataset.d).meals[t.dataset.m]=null;break;
    case 'rm-meal':dayById(t.dataset.d).meals[t.dataset.m]=null;break;
    case 'edit-price':ui.editPrice=ui.editPrice===t.dataset.id?null:t.dataset.id;break;
    case 'reset-price':delete state.prices[t.dataset.id];break;
    case 'loc':ui.diningLoc=t.dataset.id;ui.q='';break;
    case 'kind':ui.kind=t.dataset.id;break;
    case 'add-rest':{var nm=document.getElementById('nrName').value.trim();if(!nm)return;
      var loc=document.getElementById('nrLoc').value,ty=document.getElementById('nrType').value;
      var cr={id:'x-'+uid(),name:nm,loc:ty==='snack'?'Snacks':loc,type:ty,adult:num(document.getElementById('nrAdult').value),kid:num(document.getElementById('nrKid').value),e:false,c:false,inc:false,n:'Added by you.',custom:true};
      state.custom.push(cr);ui.diningLoc=cr.loc;ui.kind='all';ui.q='';break;}
    case 'rm-custom':state.custom=state.custom.filter(function(x){return x.id!==t.dataset.id;});state.days.forEach(function(d){MEALS.forEach(function(m){if(d.meals[m]===t.dataset.id)d.meals[m]=null;});});ui.editPrice=null;break;
    case 'park':ui.ridePark=t.dataset.id;break;
    case 'rank-add':{var ride=(RIDES[t.dataset.park]||[]).filter(function(r){return r.id===t.dataset.id;})[0];if(ride)addRank(t.dataset.park,ride);break;}
    case 'rank-rm':state.ranks[t.dataset.park].splice(+t.dataset.i,1);break;
    case 'rank-up':i=+t.dataset.i;if(i>0)moveItem(state.ranks[t.dataset.park],i,i-1);break;
    case 'rank-down':i=+t.dataset.i;if(i<state.ranks[t.dataset.park].length-1)moveItem(state.ranks[t.dataset.park],i,i+1);break;
    case 'rank-custom':{var inp=document.getElementById('customRide');var nm=inp&&inp.value.trim();if(!nm)return;addRank(ui.ridePark,{id:'c-'+uid(),name:nm,thrill:0});break;}
    case 'day-tab':ui.planDay=+t.dataset.i;break;
    case 'plan-add':{var dd=state.days[ui.planDay];var it=(state.ranks[t.dataset.park]||[]).filter(function(r){return r.id===t.dataset.id;})[0];if(it)addToDay(dd,it);break;}
    case 'rm-entry':state.plan[t.dataset.day]=(state.plan[t.dataset.day]||[]).filter(function(e){return e.id!==t.dataset.e;});break;
    case 'add-custom':{var lab=document.getElementById('cLabel').value.trim();if(!lab)return;var dy=state.days[ui.planDay];(state.plan[dy.id]||(state.plan[dy.id]=[])).push({id:uid(),time:document.getElementById('cTime').value||nextTime(dy),type:document.getElementById('cType').value,label:lab});break;}
    case 'print':try{window.print();}catch(x){}return;
    case 'copy-summary':{
      var txt=summaryText();
      var fin=function(ok){ui.copied=ok?'ok':'fail';render();if(ok)setTimeout(function(){if(ui.copied==='ok'){ui.copied=null;if(ui.tab==='summary')render();}},2500);};
      try{navigator.clipboard.writeText(txt).then(function(){fin(true);},function(){fin(false);});}catch(x){fin(false);}
      return;}
    case 'sample-now':state=sample();ui.planDay=0;ui.picked=null;break;
    case 'reset-sample':case 'reset-blank':{
      var kind=name==='reset-sample'?'sample':'blank';
      if(ui.confirm!==kind){ui.confirm=kind;setTimeout(function(){if(ui.confirm===kind){ui.confirm=null;footHtml();}},5000);footHtml();return;}
      ui.confirm=null;state=kind==='sample'?sample():blank();ui.picked=null;ui.planDay=0;break;}
    default:return;
  }
  save();render();
}

/* drag and drop */
var drag=null;
function handleDrop(zone,payload){
  var z=zone.split(':'),p=payload.split(':');
  if(z[0]==='meal'){
    var d=dayById(z[1]);if(!d)return;
    if(p[0]==='rest')d.meals[z[2]]=p[1];
    else if(p[0]==='move'){var s=dayById(p[1]);if(!s)return;var tmp=d.meals[z[2]];d.meals[z[2]]=s.meals[p[2]];s.meals[p[2]]=tmp;}
    else return;
    ui.picked=null;
  }else if(z[0]==='rank'){
    var park=z[1],arr=state.ranks[park]||(state.ranks[park]=[]),to=z[2]==='end'?arr.length:+z[2];
    if(p[0]==='ride'&&p[1]===park){var ride=RIDES[park].filter(function(r){return r.id===p[2];})[0];if(ride)addRank(park,ride,to);}
    else if(p[0]==='rank'&&p[1]===park){var from=+p[2];if(from===to||from+1===to)return;if(from<to)to--;moveItem(arr,from,to);}
    else return;
  }else if(z[0]==='timeline'){
    if(p[0]!=='rankadd')return;
    var day=dayById(z[1]);var it=(state.ranks[p[1]]||[]).filter(function(r){return r.id===p[2];})[0];
    if(day&&it)addToDay(day,it);else return;
  }else return;
  save();render();
}
document.addEventListener('dragstart',function(e){
  var t=e.target.closest&&e.target.closest('[data-drag]');if(!t)return;
  drag=t.dataset.drag;try{e.dataTransfer.setData('text/plain',drag);e.dataTransfer.effectAllowed='move';}catch(x){}
  t.classList.add('dragging');
});
document.addEventListener('dragend',function(){drag=null;var a=document.querySelectorAll('.dragging,.over');for(var i=0;i<a.length;i++)a[i].classList.remove('dragging','over');});
document.addEventListener('dragover',function(e){var z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();z.classList.add('over');});
document.addEventListener('dragleave',function(e){var z=e.target.closest&&e.target.closest('[data-drop]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
document.addEventListener('drop',function(e){
  var z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;
  e.preventDefault();z.classList.remove('over');
  var payload='';try{payload=e.dataTransfer.getData('text/plain');}catch(x){}
  payload=payload||drag||'';if(payload)handleDrop(z.dataset.drop,payload);
});

document.addEventListener('click',function(e){
  if(e.target.closest('input,select,label'))return;
  var t=e.target.closest('[data-act]');if(!t)return;
  act(t.dataset.act,t);
});
document.addEventListener('change',function(e){var t=e.target.closest('[data-f]');if(t)field(t);});
document.addEventListener('input',function(e){
  if(e.target.id==='catQ'){ui.q=e.target.value;var l=document.getElementById('catList');if(l)l.innerHTML=catalogItems();
    var c=document.querySelectorAll('.chip');for(var i=0;i<c.length;i++)c[i].classList.toggle('on',!ui.q&&c[i].dataset.id===ui.diningLoc);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.picked){ui.picked=null;render();}});
function route(){var h=(location.hash||'').slice(1);ui.tab=VIEWS[h]?h:'trip';ui.copied=null;render();}
window.addEventListener('hashchange',route);
window.addEventListener('resize',setTb);
route();
})();
</script>
